openapi: 3.1.0
info:
  title: MileWage API
  version: 1.0.0
  summary: Self-hosted mileage tracking server for gig riders and drivers (single driver per instance).
  description: >
    Contract between the MileWage server, the Android app and the web client.
    Units: timestamps are UTC epoch milliseconds, distances are integer metres,
    money is integer cents, coordinates are integer degrees x 10^7.
    Errors are RFC 9457 problem+json. See plan 08, the API spec kept in the git history, for the rules
    that OpenAPI cannot express (offline upload contract, WebSocket protocol, scopes).
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - deviceBearer: []
tags:
  - { name: setup }
  - { name: auth }
  - { name: devices }
  - { name: settings }
  - { name: countries }
  - { name: vehicles }
  - { name: shifts }
  - { name: stops }
  - { name: trips }
  - { name: telemetry }
  - { name: exports }
  - { name: backups }
  - { name: sync }
  - { name: diagnostics }
  - { name: platforms }
  - { name: earnings }
  - { name: expenses }
  - { name: receipts }
  - { name: tax }
  - { name: system }

x-modules:
  core:
    toggle: never
    operations: [getHealth, getSetupStatus, listCountries, getErrorType, createOwner, confirmRecoveryKey, login, logout, changePassword, resetPassword, getSettings, updateSettings, listVehicles, createVehicle, updateVehicle, getSystemStatus, getSummary, getSummarySeries, listShifts, startShift, getShift, updateShift, purgeShift, endShift, finalizeShift, recalculateShift, setShiftOdometer, listOdometerReadings, createYearOdometerReading, deleteOdometerReading, listShiftTrips, putManualTrip, updateTrip, deleteManualTrip, listOwnMileageRates, createOwnMileageRate, updateOwnMileageRate, deleteOwnMileageRate]
  devices:
    toggle: modules.devices
    default: true
    dependsOn: [core]
    operations: [createPairingToken, redeemPairingToken, listDevices, renameDevice, revokeDevice, getAppInfo, downloadAndroidApp, checkAndroidApp]
  tracking:
    toggle: modules.tracking
    default: true
    dependsOn: [core, devices]
    operations: [uploadTelemetryBatch, putTripOverride, getShiftRoute]
  sync:
    toggle: modules.sync
    default: true
    dependsOn: [core, devices]
    operations: [pullChanges]
  # local_export (v1.1): toggle modules.local_export, default false. Its restore route is not part of the v1 contract (15 section 9.1).
  stops:
    toggle: settings.stops_enabled   # the one runtime toggle: a driver-facing setting, not a restart-time config switch (section 16.1)
    default: true
    dependsOn: [core, tracking]
    operations: [listShiftStops, putStopLabel, deleteStopLabel]
  exporters:
    toggle: modules.export_<format>
    default: true
    dependsOn: [core]
    operations: [exportData]
    registry: { csv: [core], pdf: [core], expenses: [expenses], tax_summary: [tax] }
  backup:
    toggle: engine is not toggleable; backup.on_shift_end, backup.download
    default: true
    dependsOn: [core]
    operations: [listBackups, runBackup, downloadBackup, setOffsiteAck, restoreOnFreshInstance, createRecoveryKey, confirmNewRecoveryKey]
  diagnostics:
    toggle: modules.diagnostics   # plus settings.diagnostics_level (off, basic, verbose); 16 section 5
    default: true
    dependsOn: [core]
    operations: [ingestDiagnosticEvents, listDiagnosticEvents, getDiagnosticsHealth, downloadDebugBundle]
  platforms:
    toggle: modules.platforms
    default: true
    dependsOn: [core]
    operations: [listPlatforms, putPlatform, deletePlatform]
  earnings:
    toggle: modules.earnings
    default: true
    dependsOn: [core]
    operations: [listShiftEarnings, putShiftEarnings, deleteShiftEarnings, addEarningEntry, deleteEarningEntry]
  expenses:
    toggle: modules.expenses
    default: true
    dependsOn: [core]
    operations: [listExpenses, createExpense, getExpense, updateExpense, deleteExpense, getExpenseTotals, listExpenseMerchants, getDueExpenses, confirmDueExpense, snoozeExpense, listExpenseCategories]
  receipts:
    toggle: modules.receipts
    default: true
    dependsOn: [expenses]
    operations: [putExpenseReceipt, getExpenseReceipt, deleteExpenseReceipt]
  tax:
    toggle: modules.tax
    default: true
    dependsOn: [core]
    operations: [getTaxYear, updateTaxYear, getTaxJar, addTaxJarEntry, deleteTaxJarEntry, getVehicleTaxYear, putVehicleTaxYear, deleteVehicleTaxYear]
paths:
  /healthz:
    servers: [{ url: / }]
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness check (unauthenticated, reveals nothing else)
      security: []
      responses:
        '200':
          description: Database answers a trivial read.
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { const: true } } }
        '503': { description: Not healthy. }

  /setup/status:
    get:
      tags: [setup]
      operationId: getSetupStatus
      security: []
      responses:
        '200':
          description: Instance state.
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: { enum: [needs_setup, needs_confirmation, ready] }
  /setup:
    post:
      tags: [setup]
      operationId: createOwner
      summary: Create the owner account. Works only while no users exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupRequest' }
      responses:
        '201':
          description: Account created; session cookie set. The recovery key is shown once.
          content:
            application/json:
              schema:
                type: object
                required: [recovery_key, state]
                properties:
                  recovery_key: { type: string, description: age private key; never stored on the server. }
                  state: { const: needs_confirmation }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /setup/confirm:
    post:
      tags: [setup]
      operationId: confirmRecoveryKey
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [last6]
              additionalProperties: false
              properties:
                last6: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200':
          description: Setup complete; backups start.
          content:
            application/json:
              schema: { type: object, required: [state], properties: { state: { const: ready } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /setup/restore:
    post:
      tags: [setup]
      operationId: restoreOnFreshInstance
      summary: Restore a backup onto a fresh instance. Refused if any user exists (use milewage-cli restore).
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, recovery_key]
              properties:
                file: { type: string, contentMediaType: application/octet-stream, description: "The .db.gz.age backup file (up to 512 MiB on this route only)." }
                recovery_key: { type: string }
      responses:
        '200':
          description: Restored. Verification output as in 10-backup-restore-and-ops-spec §7.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestoreVerification' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /countries:
    get:
      tags: [countries]
      operationId: listCountries
      summary: The countries a driver may choose, with their regions and what each supports (plan 21 section 3.9). Public, so first-run setup can list them.
      security: []
      responses:
        '200':
          description: Countries in the order screens list them.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Country' } }
  /errors/{code}:
    get:
      tags: [system]
      operationId: getErrorType
      summary: What an error code means. This is where the `type` URI of a problem points. Public.
      security: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, description: 'An error code such as shift_finalized.' }
      responses:
        '200':
          description: The catalogue entry.
          content:
            application/json:
              schema:
                type: object
                required: [code, title, status, description]
                properties:
                  code: { type: string }
                  title: { type: string }
                  status: { type: integer }
                  description: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '204':
          description: Session cookie mw_session set.
          headers:
            Set-Cookie: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Forgot the password. The recovery key proves it is the owner; sets a new password, signs out every browser and signs this one in. 5 wrong keys per client and 20 in all per 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recovery_key, new_password]
              additionalProperties: false
              properties:
                recovery_key: { type: string, maxLength: 200, description: 'AGE-SECRET-KEY-1…, as shown at setup. Never stored.' }
                new_password: { type: string, minLength: 10 }
      responses:
        '204':
          description: Password changed; session cookie mw_session set.
          headers:
            Set-Cookie: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Session ended. }
  /auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              additionalProperties: false
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10 }
      responses:
        '204': { description: Changed; all other sessions invalidated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /pairing-tokens:
    post:
      tags: [devices]
      operationId: createPairingToken
      security: [{ sessionCookie: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                base_url: { type: string, description: "The driver's correction of the address (plan 19 section 3.2): an absolute https URL with no path, query or credentials; plain http only to a home address (plan 28: private IPv4 and IPv6 ranges, .local, .lan, .home.arpa), which then becomes home_url, or anywhere on a development server." }
      responses:
        '201':
          description: One-time token, valid 10 minutes.
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at, qr_payload, pair_url, base_url, base_url_source, home_url, away_url]
                properties:
                  token: { type: string, pattern: '^mwp_[A-Za-z0-9_-]{43}$' }
                  expires_at: { $ref: '#/components/schemas/EpochMs' }
                  qr_payload: { type: string, description: "milewage://pair?v=1&u=<server url>&t=<token>[&h=<home url>]: the link that opens the phone app (Open in the MileWage app, the code text). h (plan 28) is there when the home address differs from u; older apps ignore it." }
                  pair_url: { type: string, description: "<server url>/pair#v=1&t=<token>[&h=<home url>]: what the QR shows (plan 24 Q1), with the same h as qr_payload. The phone app reads it; any other camera opens the server's pair page, which links to the app. The token is in the fragment, so it never reaches a server log." }
                  base_url: { type: string, description: "The server address inside the code (u), without a trailing slash: away_url, else home_url, else this request's address." }
                  base_url_source: { enum: [configured, request, driver], description: "Where base_url came from: MILEWAGE_PUBLIC_URL or MILEWAGE_HOME_URL, the address of this request (as the browser sees it), or the driver's base_url." }
                  home_url: { type: [string, 'null'], description: "Plan 28: the server on the home network (http allowed): the driver's home address, MILEWAGE_HOME_URL, or this request's address when it is a home address." }
                  away_url: { type: [string, 'null'], description: "Plan 28: the https address used away from home: the driver's, MILEWAGE_PUBLIC_URL, or this request's when it is https and not a home address." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /app:
    get:
      tags: [devices]
      operationId: getAppInfo
      summary: What the public download page shows (no sign-in, the phone has no account yet). The app file is looked at on every request, so a new one is offered without a restart.
      security: []
      responses:
        '200':
          description: The app file on this server (or null), the store page (or null) and the download page's address.
          content:
            application/json:
              schema:
                type: object
                required: [apk, store_url, page_url, base_url, base_url_source]
                properties:
                  apk:
                    oneOf:
                      - type: 'null'
                      - type: object
                        required: [size_bytes, updated_at, version]
                        properties:
                          size_bytes: { type: integer, minimum: 0 }
                          updated_at: { $ref: '#/components/schemas/EpochMs' }
                          version: { type: [string, 'null'], description: "From <file>.json, written by scripts/phone-release-build.sh --publish; null without it." }
                  store_url: { type: [string, 'null'], description: MILEWAGE_APP_STORE_URL (an https link to the store page); null until the app is published. }
                  page_url: { type: string, description: "<base_url>/app: the download page, for a QR code." }
                  base_url: { type: string }
                  base_url_source: { enum: [configured, request] }
  /app/android.apk:
    get:
      tags: [devices]
      operationId: downloadAndroidApp
      summary: The Android app this server hands out (plan 24 Q2). No sign-in. A 404 when the owner has not put the file in place (MILEWAGE_APK_PATH, default <config>/milewage.apk).
      security: []
      responses:
        '200':
          description: The APK file.
          content:
            application/vnd.android.package-archive: { schema: { type: string, contentMediaType: application/vnd.android.package-archive } }
        '404': { $ref: '#/components/responses/NotFound' }
    head:
      tags: [devices]
      operationId: checkAndroidApp
      summary: Whether the app file is there, without downloading it (the web shows Get the app only then).
      security: []
      responses:
        '200': { description: The file is there. }
        '404': { description: No app file on this server. }
  /pairing/redeem:
    post:
      tags: [devices]
      operationId: redeemPairingToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, device_name, platform]
              additionalProperties: false
              properties:
                token: { type: string }
                device_name: { type: string, maxLength: 64 }
                platform: { enum: [android, ios] }
                app_version: { type: string, maxLength: 32 }
      responses:
        '201':
          description: Device created. The credential is returned once and never again.
          content:
            application/json:
              schema:
                type: object
                required: [device_id, device_token, settings]
                properties:
                  device_id: { type: integer }
                  device_token: { type: string, pattern: '^mwd_[A-Za-z0-9_-]{43}$' }
                  settings: { $ref: '#/components/schemas/Settings' }
                  home_url: { type: [string, 'null'], description: "Plan 28: the server's home-network address as this server knows it (null when unknown); absent from older servers." }
                  away_url: { type: [string, 'null'], description: "Plan 28: the server's https address for away from home (null when unknown); absent from older servers." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: All paired devices, including revoked ones.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Device' } }
  /devices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [devices]
      operationId: renameDevice
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties: { name: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: Revoke a device. Its next request returns 401 device_revoked.
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Revoked (idempotent). }
        '404': { $ref: '#/components/responses/NotFound' }

  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      responses:
        '200':
          description: Current settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
    patch:
      tags: [settings]
      operationId: updateSettings
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsPatch' }
      responses:
        '200':
          description: Updated. A timezone change affects only shifts started afterwards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /own-mileage-rates:
    get:
      tags: [settings]
      operationId: listOwnMileageRates
      summary: 'Your mileage rates with their dates, oldest first (ADR 0007). Each is in force from its date until the next. They value mileage from their date when settings.use_own_mileage_rate is true, or where the country has no rates. Web session only.'
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The rates.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DatedOwnMileageRate' } }
    post:
      tags: [settings]
      operationId: createOwnMileageRate
      summary: Add a rate from a date. One rate per day, and one without a date ("from the start").
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatedOwnMileageRateCreate' }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatedOwnMileageRate' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /own-mileage-rates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [settings]
      operationId: updateOwnMileageRate
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatedOwnMileageRatePatch' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatedOwnMileageRate' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [settings]
      operationId: deleteOwnMileageRate
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Removed. Shifts on its days take the rate before it, or the country's. }
        '404': { $ref: '#/components/responses/NotFound' }

  /vehicles:
    get:
      tags: [vehicles]
      operationId: listVehicles
      parameters:
        - { name: include_archived, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Vehicles.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Vehicle' } }
    post:
      tags: [vehicles]
      operationId: createVehicle
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /vehicles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [vehicles]
      operationId: updateVehicle
      summary: Rename, edit details, or archive/unarchive. Vehicles are never deleted. Archiving the default vehicle clears the default.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, maxLength: 64 }
                kind: { $ref: '#/components/schemas/VehicleKind' }
                archived: { type: boolean }
                make: { type: [string, 'null'], maxLength: 64 }
                model: { type: [string, 'null'], maxLength: 64 }
                year: { type: [integer, 'null'], minimum: 1900, maximum: 2100 }
                plate: { type: [string, 'null'], maxLength: 16 }
                power: { oneOf: [{ $ref: '#/components/schemas/VehiclePower' }, { type: 'null' }] }
                ownership: { $ref: '#/components/schemas/VehicleOwnership' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /odometer:
    get:
      tags: [vehicles]
      operationId: listOdometerReadings
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: vehicle_id, in: query, schema: { type: integer } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/OdometerKind' } }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200':
          description: Readings, newest first (at most 500).
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/OdometerReading' } }
    post:
      tags: [vehicles]
      operationId: createYearOdometerReading
      summary: Record a fiscal-year start or end reading (CRA). Shift readings use the PUT route.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_id, kind, reading_m, recorded_at]
              additionalProperties: false
              properties:
                vehicle_id: { type: integer }
                kind: { enum: [year_start, year_end] }
                reading_m: { type: integer, minimum: 0 }
                recorded_at: { $ref: '#/components/schemas/EpochMs' }
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OdometerReading' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /odometer/{id}:
    delete:
      tags: [vehicles]
      operationId: deleteOdometerReading
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }

  /shifts:
    get:
      tags: [shifts]
      operationId: listShifts
      summary: List shifts. A device sees only shifts started in the last 14 days.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ShiftStatus' } }
        - { name: vehicle_id, in: query, schema: { type: integer } }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: A page of shifts, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [shifts]
      operationId: startShift
      summary: Start a shift. Idempotent on client_id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShiftStart' }
      responses:
        '200':
          description: A shift with this client_id already exists; returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '201':
          description: Started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '409':
          description: Another shift is already active. Body includes it as active_shift.
          content:
            application/problem+json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Problem' }
                  - type: object
                    properties:
                      active_shift: { $ref: '#/components/schemas/Shift' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
  /shifts/{ref}:
    parameters:
      - { $ref: '#/components/parameters/Ref' }
    get:
      tags: [shifts]
      operationId: getShift
      responses:
        '200':
          description: The shift.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [shifts]
      operationId: updateShift
      summary: Edit notes or vehicle. Start/end times are not editable (they define which points count).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                notes: { type: [string, 'null'], maxLength: 2000 }
                vehicle_id: { type: integer }
                updated_at: { $ref: '#/components/schemas/EpochMs' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [shifts]
      operationId: purgeShift
      summary: Permanently delete a shift and everything under it (web only). An active shift is 409 shift_not_ended; a shift under 7 years old without confirm_recent=true is 422.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: confirm_recent
          in: query
          description: Required as true when the shift is under 7 years old (07 section 4.2).
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /shifts/{ref}/end:
    post:
      tags: [shifts]
      operationId: endShift
      summary: End a shift and compute trips and totals. Idempotent.
      parameters:
        - { $ref: '#/components/parameters/Ref' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ended_at]
              additionalProperties: false
              properties:
                ended_at: { $ref: '#/components/schemas/EpochMs' }
                manifest: { $ref: '#/components/schemas/PointManifest' }
                phone_result: { $ref: '#/components/schemas/PhoneResult' }
                interruptions: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Interruption' } }
      responses:
        '200':
          description: Ended (or already ended; returned unchanged). Totals are null only if the server could not yet compute them; `recon` is present when the request carried a `phone_result`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EndShiftResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
  /shifts/{ref}/finalize:
    post:
      tags: [shifts]
      operationId: finalizeShift
      summary: Mark the shift as reviewed. Makes it eligible for raw-point archiving; further points are refused.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Ref' }
      responses:
        '200':
          description: Finalized.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /shifts/{ref}/recalculate:
    post:
      tags: [shifts]
      operationId: recalculateShift
      summary: Recompute trips and totals with the current algorithm (bumps calc_version). A finalized shift returns 409 shift_finalized; the dry-run comparison report is CLI only (14 section 11).
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Ref' }
      responses:
        '200':
          description: Recomputed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /shifts/{ref}/odometer/{kind}:
    put:
      tags: [shifts]
      operationId: setShiftOdometer
      summary: Set the shift's start or end odometer reading. Idempotent on (shift, kind).
      parameters:
        - { $ref: '#/components/parameters/Ref' }
        - { name: kind, in: path, required: true, schema: { enum: [shift_start, shift_end] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reading_m, recorded_at]
              additionalProperties: false
              properties:
                reading_m: { type: integer, minimum: 0 }
                recorded_at: { $ref: '#/components/schemas/EpochMs' }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OdometerReading' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /shifts/{ref}/route:
    get:
      tags: [shifts]
      operationId: getShiftRoute
      summary: Compact columnar route for the shift's map (raw points, or the archive after retention).
      parameters:
        - { $ref: '#/components/parameters/Ref' }
      responses:
        '200':
          description: Route arrays of equal length.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Route' }
        '404': { $ref: '#/components/responses/NotFound' }
  /shifts/{ref}/trips:
    parameters:
      - { $ref: '#/components/parameters/Ref' }
    get:
      tags: [trips]
      operationId: listShiftTrips
      responses:
        '200':
          description: Trips of the shift in time order.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Trip' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /trips/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [trips]
      operationId: updateTrip
      summary: Change kind or purpose. Distance of an auto trip cannot be changed (07 D14).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                kind: { enum: [active, deadhead, personal] }
                purpose: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Updated; shift totals recomputed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripEditResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [trips]
      operationId: deleteManualTrip
      summary: Delete a manual trip only (auto trips return 409 trip_not_editable).
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /shifts/{ref}/trips/{client_id}:
    parameters:
      - { $ref: '#/components/parameters/Ref' }
      - { name: client_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [trips]
      operationId: putManualTrip
      summary: Add or edit a trip the phone failed to record (source = manual). Distance is typed in. Idempotent on client_id; last-writer-wins on edited_at; X-MileWage-Applied says whether it applied.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualTripPut' }
      responses:
        '200':
          description: Stored or unchanged; the current server row is returned.
          headers:
            X-MileWage-Applied: { schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripEditResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /shifts/{ref}/trip-overrides/{trip_key}:
    parameters:
      - { $ref: '#/components/parameters/Ref' }
      - { name: trip_key, in: path, required: true, schema: { type: string }, description: 'URL-encoded; format <shift client_id>:<segment start epoch ms>:<original_kind> (14 section 6.4).' }
    put:
      tags: [trips]
      operationId: putTripOverride
      summary: Idempotent reclassification or re-description of an auto trip, stored apart from the derived trip so a recompute cannot erase it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripOverridePut' }
      responses:
        '200':
          description: Stored or unchanged; shift totals recomputed. If no trip has this key the override is kept and reported as override_orphaned.
          headers:
            X-MileWage-Applied: { schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripEditResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /sync/changes:
    get:
      tags: [sync]
      operationId: pullChanges
      summary: Changes since a cursor within the caller's read window (web edits, recalculations, deletes).
      parameters:
        - { name: after, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
      responses:
        '200':
          description: A page of changes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncChanges' }
        '410':
          description: cursor_expired. The server pruned its change log or was restored; do a full window pull.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  /shifts/{ref}/stops:
    parameters:
      - { $ref: '#/components/parameters/Ref' }
    get:
      tags: [stops]
      operationId: listShiftStops
      summary: The shift's auto-detected stops (14 section 6), each with confidence, estimated role and any web label. Web only. 404 when the stops setting is off.
      responses:
        '200':
          description: Stops in time order.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Stop' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /shifts/{ref}/stop-labels/{stop_key}:
    parameters:
      - { $ref: '#/components/parameters/Ref' }
      - { name: stop_key, in: path, required: true, schema: { type: string }, description: 'URL-encoded; format <shift client_id>:<anchor fix epoch ms>:stop (14 section 6.2).' }
    put:
      tags: [stops]
      operationId: putStopLabel
      summary: Optional, web only. Label a detected stop; idempotent, last-writer-wins on edited_at. Recomputes the shift (the estimate may change; total business distance never does).
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StopLabelPut' }
      responses:
        '200':
          description: Stored or unchanged; the stop and the recomputed shift are returned. If no stop has this key the label is kept and reported as label_orphaned.
          headers:
            X-MileWage-Applied: { schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopLabelResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
    delete:
      tags: [stops]
      operationId: deleteStopLabel
      summary: Clear a stop's label; the engine's estimate applies again.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Cleared; the stop and the recomputed shift are returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopLabelResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /telemetry/batch:
    post:
      tags: [telemetry]
      operationId: uploadTelemetryBatch
      summary: Upload up to 200 breadcrumb points for one shift. Safe to retry (idempotent on device_id + seq).
      security: [{ deviceBearer: [] }]
      parameters:
        - { name: Content-Encoding, in: header, schema: { enum: [gzip, identity] } }
        - { name: X-Client-Time, in: header, schema: { type: integer }, description: Phone clock, epoch ms. }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelemetryBatch' }
      responses:
        '200':
          description: Every point not listed in rejected is durably stored.
          headers:
            X-Server-Time: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetryBatchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /summary:
    get:
      tags: [system]
      operationId: getSummary
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: platform, in: query, schema: { type: string, pattern: '^[a-z0-9_]{1,32}$' }, description: Filters earnings only; distance is not split by platform (platform_filter says so). }
      responses:
        '200':
          description: Totals for the period.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Summary' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /summary/series:
    get:
      tags: [system]
      operationId: getSummarySeries
      summary: The summary's figures per day or per month, every slot of the range included (the dashboard's charts and the Shifts page's bars). At most 366 days by day, two years by month.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: bucket, in: query, schema: { enum: [day, month], default: day } }
      responses:
        '200':
          description: One bucket per day or month, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SummarySeries' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /platforms:
    get:
      tags: [platforms]
      operationId: listPlatforms
      summary: Built-in platforms of the country merged with the driver's overrides and custom ones, in sort order.
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Platforms.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Platform' } }
  /platforms/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9_]{1,32}$' } }
    put:
      tags: [platforms]
      operationId: putPlatform
      summary: Create a custom platform or override a built-in's active, sort, target, colour and emoji (label only on a custom one). Idempotent.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformPut' }
      responses:
        '200':
          description: The platform.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Platform' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [platforms]
      operationId: deletePlatform
      summary: Delete a custom platform that no label or earnings row uses (else 409 platform_in_use; deactivate instead). A built-in's override is reset.
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Deleted or reset. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /shifts/{ref}/earnings:
    parameters:
      - { $ref: '#/components/parameters/Ref' }
    get:
      tags: [earnings]
      operationId: listShiftEarnings
      summary: Typed rows, the stop-label breakdown per platform, and the effective figure per platform.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Earnings of the shift.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftEarnings' }
        '404': { $ref: '#/components/responses/NotFound' }
  /shifts/{ref}/earnings/{platform}:
    parameters:
      - { $ref: '#/components/parameters/Ref' }
      - { name: platform, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9_]{1,32}$' } }
    put:
      tags: [earnings]
      operationId: putShiftEarnings
      summary: Idempotent upsert of the driver's total for one platform. The shift must be ended or finalized. Replaces that platform's label sum unless the server is set to add them.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShiftEarningsPut' }
      responses:
        '200':
          description: Earnings of the shift after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftEarnings' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [earnings]
      operationId: deleteShiftEarnings
      summary: Remove the typed row (idempotent); the platform's labels apply again.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Earnings of the shift after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftEarnings' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shifts/{ref}/earnings/{platform}/entries:
    parameters:
      - { $ref: '#/components/parameters/Ref' }
      - { name: platform, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9_]{1,32}$' } }
    post:
      tags: [earnings]
      operationId: addEarningEntry
      summary: Add one entry (plan 22) to the platform's row, creating the row if missing. The shift must be ended or finalized. The amount's sign must match the type (422 otherwise).
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EarningEntryCreate' }
      responses:
        '200':
          description: Earnings of the shift after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftEarnings' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /shifts/{ref}/earnings/{platform}/entries/{id}:
    parameters:
      - { $ref: '#/components/parameters/Ref' }
      - { name: platform, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9_]{1,32}$' } }
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    delete:
      tags: [earnings]
      operationId: deleteEarningEntry
      summary: Remove one entry (idempotent). The row stays; with no entries its total is 0. There is no edit; delete and add again.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Earnings of the shift after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftEarnings' }
        '404': { $ref: '#/components/responses/NotFound' }

  /expenses:
    get:
      tags: [expenses]
      operationId: listExpenses
      summary: Expenses newest first; templates=true lists the recurring reminders instead.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: category, in: query, schema: { type: string } }
        - { name: deductible, in: query, schema: { type: boolean } }
        - { name: vehicle_id, in: query, schema: { type: integer } }
        - { name: shift_id, in: query, schema: { type: integer }, description: The expenses linked to one shift (its parking and tolls on the shift page). }
        - { name: templates, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpensePage' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [expenses]
      operationId: createExpense
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCreate' }
      responses:
        '201':
          description: Created. deductible_cents and double_counts are read-time values.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /expenses/totals:
    get:
      tags: [expenses]
      operationId: getExpenseTotals
      summary: Deductible against total spend for a calendar year, per category.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: year, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseTotals' }
  /expenses/merchants:
    get:
      tags: [expenses]
      operationId: listExpenseMerchants
      summary: Distinct merchants starting with q, newest first (autocomplete).
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { type: array, items: { type: string } }
  /expenses/due:
    get:
      tags: [expenses]
      operationId: getDueExpenses
      summary: Recurring templates due today or earlier and not snoozed.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Expense' } }
  /expenses/categories:
    get:
      tags: [expenses]
      operationId: listExpenseCategories
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ExpenseCategory' } }
  /expenses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [expenses]
      operationId: getExpense
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [expenses]
      operationId: updateExpense
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpensePatch' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [expenses]
      operationId: deleteExpense
      summary: Delete. Deleting a template keeps its occurrences.
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
  /expenses/{id}/occurrences:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [expenses]
      operationId: confirmDueExpense
      summary: Create one occurrence of a recurring template on the given date and move the template's next_due one interval on.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spent_on]
              additionalProperties: false
              properties:
                spent_on: { type: string, format: date }
                amount_cents: { type: integer, minimum: 1 }
      responses:
        '201':
          description: The occurrence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /expenses/{id}/snooze:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      tags: [expenses]
      operationId: snoozeExpense
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until]
              additionalProperties: false
              properties:
                until: { type: string, format: date }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /expenses/{id}/receipt:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      tags: [receipts]
      operationId: putExpenseReceipt
      summary: Upload or replace the one receipt of an expense (JPEG, PNG, WebP or PDF, 10 MB at most). The server removes GPS data from a JPEG, PNG or WebP photo (a PDF is stored as it is) and checks the bytes against the declared type. Web session only.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
          application/pdf: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: Replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
    get:
      tags: [receipts]
      operationId: getExpenseReceipt
      summary: The receipt file, streamed with its stored type.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The file.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [receipts]
      operationId: deleteExpenseReceipt
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Removed (idempotent). }
        '404': { $ref: '#/components/responses/NotFound' }

  /tax/{year}:
    parameters:
      - { name: year, in: path, required: true, schema: { type: integer, minimum: 2000, maximum: 2100 } }
    get:
      tags: [tax]
      operationId: getTaxYear
      summary: The estimate for a tax year with its working, deadlines, slip alerts and the jar balance. supported=false for a country without a pack.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: collected_cents, in: query, schema: { type: integer, minimum: 0 }, description: Sales tax the driver collected, typed (nothing is inferred). }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxYear' }
    put:
      tags: [tax]
      operationId: updateTaxYear
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                set_aside_bp: { type: integer, minimum: 0, maximum: 10000 }
                sales_tax_registered: { type: boolean }
                pays_instalments: { type: boolean }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxYear' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /tax/{year}/jar:
    parameters:
      - { name: year, in: path, required: true, schema: { type: integer, minimum: 2000, maximum: 2100 } }
    get:
      tags: [tax]
      operationId: getTaxJar
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxJar' }
    post:
      tags: [tax]
      operationId: addTaxJarEntry
      summary: Add to or take from the manual set-aside ledger. Nothing moves real money.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_cents]
              additionalProperties: false
              properties:
                amount_cents: { type: integer, description: Positive = set aside, negative = withdrawn; not zero. }
                entered_on: { type: string, format: date }
                note: { type: [string, 'null'], maxLength: 200 }
      responses:
        '201':
          description: The jar after the entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxJar' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /tax/jar/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [tax]
      operationId: deleteTaxJarEntry
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
  /vehicles/{id}/tax-years/{year}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: year, in: path, required: true, schema: { type: integer, minimum: 2000, maximum: 2100 } }
    get:
      tags: [tax]
      operationId: getVehicleTaxYear
      summary: How the vehicle is deducted in the year. Without a saved row the country default (standard mileage) applies.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleTaxYear' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [tax]
      operationId: putVehicleTaxYear
      summary: Choose standard mileage or actual expenses. actual_expenses makes the mileage deduction value null for the vehicle and year. The rate fields are stored and returned but not applied.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              additionalProperties: false
              properties:
                method: { enum: [standard_mileage, actual_expenses] }
                rate1_milli: { type: [integer, 'null'], minimum: 0 }
                rate2_milli: { type: [integer, 'null'], minimum: 0 }
                threshold_m: { type: [integer, 'null'], minimum: 0 }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleTaxYear' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [tax]
      operationId: deleteVehicleTaxYear
      summary: Return to the country default.
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Reset. }
        '404': { $ref: '#/components/responses/NotFound' }


  /exports/{format}:
    get:
      tags: [exports]
      operationId: exportData
      summary: 'Download a file from a registered exporter (csv, pdf, expenses, tax_summary). A disabled or unknown format returns 404. pdf is the mileage and expenses report for an accountant: from/to (at most 366 days) or year (the calendar year, as the tax summary), default this year.'
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: format, in: path, required: true, schema: { enum: [csv, pdf, expenses, tax_summary] }, description: 'Only formats whose exporter is registered and enabled exist. expenses, tax_summary and pdf are reports over a period, not a selection of shifts: from/to are optional for them, year selects the tax year, format=json is for tax_summary only.' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: shift_id, in: query, schema: { type: integer }, description: Alternative to from/to. }
        - { name: vehicle_id, in: query, schema: { type: integer } }
        - { name: level, in: query, description: "CSV only.", schema: { enum: [trip, shift], default: trip } }
        - { name: year, in: query, schema: { type: integer }, description: Tax year for tax_summary and the default year of expenses. }
        - { name: category, in: query, schema: { type: string }, description: expenses only. }
        - { name: format, in: query, schema: { enum: [csv, json], default: csv }, description: tax_summary only. }
        - { name: paper, in: query, schema: { enum: [a4, letter] }, description: 'pdf only. Default: US Letter where the country uses it (Unicode CLDR), A4 elsewhere.' }
      responses:
        '200':
          description: The file, streamed.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            text/csv: { schema: { type: string } }
            application/pdf: { schema: { type: string, contentMediaType: application/pdf } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /backups:
    get:
      tags: [backups]
      operationId: listBackups
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Backups on disk with the result of their verification.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Backup' } }
    post:
      tags: [backups]
      operationId: runBackup
      summary: Run a verified backup now (rate-limited to once per 15 minutes).
      security: [{ sessionCookie: [] }]
      responses:
        '201':
          description: Backup written and verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backup' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
  /backups/{id}/download:
    get:
      tags: [backups]
      operationId: downloadBackup
      summary: Download the encrypted backup file. Also resets the 30-day off-site reminder.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The .db.gz.age file.
          content:
            application/octet-stream: { schema: { type: string, contentMediaType: application/octet-stream } }
        '404': { $ref: '#/components/responses/NotFound' }
  /backups/offsite-ack:
    put:
      tags: [backups]
      operationId: setOffsiteAck
      summary: "Set the 'my backup folder is synced elsewhere' flag (re-asked every 90 days)."
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [synced_elsewhere]
              additionalProperties: false
              properties:
                synced_elsewhere: { type: boolean }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OffsiteState' }
  /backups/recovery-key:
    post:
      tags: [backups]
      operationId: createRecoveryKey
      summary: Make a new recovery key (10 section 9). Needs the owner's password. Backups keep using the old key until the new one is confirmed.
      description: >-
        The new private key is shown once and never stored. Backups made before the change are not
        re-encrypted and still need the old key. A new request replaces a key that was not confirmed.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewRecoveryKeyRequest' }
      responses:
        '201':
          description: The new key, shown once. Confirm it with its last 6 characters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewRecoveryKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /backups/recovery-key/confirm:
    post:
      tags: [backups]
      operationId: confirmNewRecoveryKey
      summary: Confirm the new recovery key; backups switch to it and one backup is made with it at once.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [last6]
              additionalProperties: false
              properties:
                last6: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200':
          description: New backups use the new key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewRecoveryKeyConfirmed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /system/status:
    get:
      tags: [system]
      operationId: getSystemStatus
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Operational status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }
  /diagnostics/events:
    post:
      tags: [diagnostics]
      operationId: ingestDiagnosticEvents
      summary: Upload diagnostics events (16). A device sends phone sources; a web session sends web errors only. Idempotent on (device, src, seq). Every event is validated against the allowlist schema; rejects are listed and never fail the batch.
      security: [{ sessionCookie: [] }, { deviceBearer: [] }]
      parameters:
        - { name: Content-Encoding, in: header, schema: { enum: [gzip, identity] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagIngestRequest' }
      responses:
        '200':
          description: Accepted events are stored; duplicates, discarded and rejected events are counted. Verbose events are accepted and discarded while disk is low.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagIngestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
    get:
      tags: [diagnostics]
      operationId: listDiagnosticEvents
      summary: Filtered, cursor-paginated diagnostics events. Web only.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: from_at, in: query, schema: { $ref: '#/components/schemas/EpochMs' } }
        - { name: to_at, in: query, schema: { $ref: '#/components/schemas/EpochMs' } }
        - { name: kind, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: src, in: query, schema: { enum: [phone_native, phone_js, server, web] } }
        - { name: device_id, in: query, schema: { type: integer } }
        - { name: shift, in: query, description: Shift client_id., schema: { type: string, format: uuid } }
        - { name: level, in: query, schema: { enum: [basic, verbose] } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: A page of events, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagEventPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /diagnostics/health:
    get:
      tags: [diagnostics]
      operationId: getDiagnosticsHealth
      summary: Tracking-health checks and score per paired device (last 7 shifts) and the server checks (16 section 10.1). Computed on read.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Health result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagnosticsHealth' }
        '404': { $ref: '#/components/responses/NotFound' }
  /diagnostics/bundle:
    get:
      tags: [diagnostics]
      operationId: downloadDebugBundle
      summary: Redacted debug bundle (16 section 10.2) - versions, health, per-shift summaries and re-validated events with relative times and pseudonymous ids.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: shift, in: query, description: Shift client_id., schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The gzipped JSON bundle.
          content:
            application/gzip: { schema: { type: string, contentMediaType: application/gzip } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: mw_session }
    deviceBearer: { type: http, scheme: bearer, bearerFormat: "mwd_ opaque token" }

  parameters:
    Ref:
      name: ref
      in: path
      required: true
      description: Integer id or UUID client_id.
      schema: { type: string, pattern: '^([0-9]+|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$' }
    From:
      name: from
      in: query
      description: Local date YYYY-MM-DD in the instance timezone, inclusive.
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      schema: { type: string, format: date }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    BadRequest: { description: Malformed request., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unauthorized: { description: Missing, invalid or revoked credential., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Forbidden: { description: Scope, origin or setup state forbids this., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: No such row for this user., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: State conflict (see code)., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    TooLarge: { description: Body too large., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unprocessable: { description: Validation failed., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unavailable: { description: Read-only mode or restoring; retryable., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    InsufficientStorage: { description: Free disk below 200 MB; retryable., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  schemas:
    EpochMs: { type: integer, minimum: 0, description: UTC milliseconds since the Unix epoch. }
    Problem:
      type: object
      required: [type, title, status, code, retryable]
      properties:
        type:
          type: string
          description: A relative URI reference (RFC 9457) that ends with `code`. GET it on the same server for a plain description.
          example: /api/v1/errors/shift_finalized
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        retryable: { type: boolean }
        request_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string, description: JSON Pointer into the request body. }
              message: { type: string }

    Country:
      type: object
      required: [code, name, currency, unit, labels, supports, verified, work, regional_rules, regions]
      properties:
        code: { type: string, description: ISO 3166-1 alpha-2. }
        name: { type: string, description: 'From Unicode CLDR (Intl.DisplayNames), in English.' }
        currency: { type: string, description: ISO 4217. }
        unit: { enum: [km, mi] }
        labels:
          type: object
          required: [region, city]
          description: What the country calls its levels, in libaddressinput's words (province, state, nation ...); null when it has none.
          properties:
            region: { type: [string, 'null'] }
            city: { type: [string, 'null'] }
        supports:
          type: object
          required: [mileage, tax]
          properties:
            mileage: { type: boolean, description: The country has published mileage rates. }
            tax: { type: boolean, description: 'The country has a tax estimate and comma.tax_countries does not hide it.' }
        verified: { type: boolean, description: False until a person has checked the figures against the primary sources. }
        work: { type: array, items: { $ref: '#/components/schemas/WorkKind' }, description: 'Kinds of platform work the country''s data covers (plan 21 section 3.6a). With one kind, onboarding does not ask (plan 23).' }
        regional_rules: { type: boolean, description: 'Some region or city has its own rules, so setting the region can change results.' }
        regions: { type: array, items: { $ref: '#/components/schemas/CountryPlace' } }
    WorkKind:
      description: 'Location-based platform work (plan 21 section 3.6a): food or parcel delivery, ride-hailing, motorcycle taxi, courier.'
      enum: [delivery, ride_hailing, moto_taxi, courier]
    CountryPlace:
      type: object
      required: [code, name, own_rules, verified, cities]
      properties:
        code: { type: string, description: 'A region: the ISO 3166-2 part after the country, as settings.region stores it (ON). A city: its full code (US-NY-NYC).' }
        name: { type: string }
        own_rules: { type: boolean, description: This place has data that differs from the level above. }
        verified: { type: boolean, description: True only if every level that supplies data was checked by a person. }
        cities: { type: array, items: { $ref: '#/components/schemas/CountryPlace' } }
    SetupRequest:
      type: object
      required: [username, password, country, distance_unit, currency, timezone]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 10 }
        country: { type: string, minLength: 2, maxLength: 2 }
        distance_unit: { enum: [km, mi] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        timezone: { type: string, description: IANA name }
    Modules:
      type: object
      description: Read-only module flags so clients can hide screens and buttons of absent modules.
      required: [tax, receipts, expenses, earnings, platforms, devices, tracking, stops, sync, diagnostics, backup_download, exporters, countries]
      properties:
        platforms: { type: boolean, description: 'Platforms module registered (18 section 4.2).' }
        earnings: { type: boolean, description: 'Earnings module registered (18 section 4.3): the driver can type a total per shift and platform.' }
        expenses: { type: boolean, description: 'Expenses module registered (18 section 5).' }
        receipts: { type: boolean, description: 'Receipts module registered (18 section 5.4); needs expenses.' }
        tax: { type: boolean, description: 'Tax module registered (18 section 7). The estimate itself exists only for countries whose pack is verified or switched on.' }
        sync: { type: boolean }
        local_export: { type: boolean, description: Reserved for v1.1; false in v1. }
        devices: { type: boolean }
        tracking: { type: boolean }
        stops: { type: boolean, description: 'Effective flag: the stops module is registered AND settings.stops_enabled is true. When false the phone and the web hide every stop and estimated-split element.' }
        diagnostics: { type: boolean, description: 'Diagnostics module registered (16). When false the phone behaves as level off and the web hides the Diagnostics screens.' }
        backup_download: { type: boolean }
        exporters: { type: array, items: { enum: [csv, pdf, expenses, tax_summary] } }
        countries: { type: array, items: { type: string, minLength: 2, maxLength: 2 } }
    Settings:
      type: object
      required: [country, distance_unit, currency, timezone, raw_retention_days, stops_enabled, help_enabled, display_name, region, logbook, own_mileage_rate, mileage_rate, week_start, time_format, default_vehicle_id, work_kinds, onboarded_at, setup_done, engine_version, diagnostics, modules]
      properties:
        modules: { $ref: '#/components/schemas/Modules' }
        engine_version: { type: integer, description: The server's track-engine algorithmVersion (14 section 11). A phone with a lower number still shows its own result until sync. }
        country: { type: string }
        distance_unit: { enum: [km, mi] }
        currency: { type: string }
        timezone: { type: string }
        raw_retention_days: { type: integer, minimum: 7 }
        stops_enabled: { type: boolean, description: 'Driver-facing toggle for auto-detected stops, the estimated active/deadhead split and web labelling (decision 1.5b). Default true. Captured per shift at shift start (Shift.segmenter), so changing it never alters an existing shift.' }
        help_enabled: { type: boolean, description: 'The owner''s switch for the Help pages in the web app and the help links on screens. Default true. Web only; the server has no help module (ADR 0002).' }
        display_name: { type: [string, 'null'], description: Greeting and export header. }
        region: { type: [string, 'null'], description: 'Subdivision code without the country (CA: ON, QC ...); validated by the country pack.' }
        logbook:
          type: [object, 'null']
          description: What the tax office of the driver's country and region asks of odometer records (plan 21 logbook slot), for the Odometer screen. null when the country has no such rule; readings are then optional.
          required: [readings, notes]
          properties:
            readings: { type: string }
            notes: { type: array, items: { type: string } }
        own_mileage_rate:
          oneOf: [{ $ref: '#/components/schemas/OwnMileageRate' }, { type: 'null' }]
          description: 'Your mileage rate in force today (plan 21 Q5, ADR 0007), or null. The dated list is GET /own-mileage-rates. It values mileage where the country has no official rates, and replaces them from its date when use_own_mileage_rate is true.'
        mileage_rate: { enum: [official, yours, none], description: 'Which rate values mileage driven today: the country''s published rates, the driver''s own (screens and exports label it "your rate", never official), or none. Older shifts may differ by date: Shift.deduction_rate says which valued each.' }
        use_own_mileage_rate: { type: boolean, description: 'ADR 0007: your mileage rates replace the country''s from their dates. Default false. Without country rates your rate applies anyway.' }
        week_start: { enum: [0, 1], description: 0 Sunday, 1 Monday. Changes week boundaries, so the phone reads it. }
        time_format: { enum: [12h, 24h] }
        default_vehicle_id: { type: [integer, 'null'], description: Preselected when a shift starts; always an active vehicle. }
        work_kinds: { type: array, items: { $ref: '#/components/schemas/WorkKind' }, description: 'The work the driver does, among what the country offers. When none is chosen and the country offers one kind, that kind (plan 23 rule 1).' }
        onboarded_at: { oneOf: [{ $ref: '#/components/schemas/EpochMs' }, { type: 'null' }], description: 'When the driver finished the web onboarding (plan 23); null while it is not finished, so the web opens it.' }
        setup_done: { type: array, items: { $ref: '#/components/schemas/SetupStep' }, description: 'Dashboard "Finish setting up" steps the driver finished or skipped. A listed step stays done even if, say, the phone is unpaired later.' }
        diagnostics: { $ref: '#/components/schemas/DiagnosticsSettings' }
    SettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        country: { type: string, minLength: 2, maxLength: 2 }
        distance_unit: { enum: [km, mi] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        timezone: { type: string }
        raw_retention_days: { type: integer, minimum: 7 }
        stops_enabled: { type: boolean }
        help_enabled: { type: boolean }
        diagnostics_level: { enum: [off, basic, verbose], description: 'verbose reverts to basic after 7 days (16 section 5).' }
        display_name: { type: [string, 'null'], maxLength: 64 }
        region: { type: [string, 'null'], minLength: 2, maxLength: 3, description: A new country clears a region it does not have. }
        week_start: { enum: [0, 1] }
        time_format: { enum: [12h, 24h] }
        default_vehicle_id: { type: [integer, 'null'], minimum: 1 }
        own_mileage_rate:
          oneOf: [{ $ref: '#/components/schemas/OwnMileageRate' }, { type: 'null' }]
          description: 'Sets (or with null removes) your undated rate, "from the start" (ADR 0007). Dated rates are kept in /own-mileage-rates.'
        use_own_mileage_rate: { type: boolean, description: 'true: your mileage rates replace the country''s from their dates (ADR 0007).' }
        work_kinds: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/WorkKind' }, description: 'Only kinds the country offers (422 otherwise); a new country drops the kinds it does not offer.' }
        onboarded: { type: boolean, description: 'true: onboarding finished (sets onboarded_at, keeping an earlier time); false: run it again (clears onboarded_at and setup_done).' }
        setup_done: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/SetupStep' }, description: 'Steps to add to setup_done; steps already listed are kept (it never removes one).' }
    SetupStep:
      enum: [vehicle, phone, backup]
    OwnMileageRate:
      type: object
      additionalProperties: false
      required: [cents_per_unit, unit]
      properties:
        cents_per_unit: { type: number, exclusiveMinimum: 0, maximum: 100000, description: 'Minor units of the currency per km or mile; hundredths are kept (30.5).' }
        unit: { enum: [km, mi] }
    DatedOwnMileageRate:
      type: object
      additionalProperties: false
      required: [id, effective_from, cents_per_unit, unit, note]
      description: 'One of your mileage rates (ADR 0007): in force from effective_from until the next rate. Shown as "your rate", never as an official rate.'
      properties:
        id: { type: integer }
        effective_from: { type: [string, 'null'], format: date, description: 'The first local date it values; null means from the start (the undated rate set before rates had dates).' }
        cents_per_unit: { type: number, exclusiveMinimum: 0, maximum: 100000, description: 'Minor units of the currency per km or mile; hundredths are kept (72.5).' }
        unit: { enum: [km, mi] }
        note: { type: [string, 'null'], maxLength: 200, description: 'Where the figure comes from, for example "Employer reimbursement 2026".' }
    DatedOwnMileageRateCreate:
      type: object
      additionalProperties: false
      required: [effective_from, cents_per_unit, unit]
      properties:
        effective_from: { type: [string, 'null'], format: date, description: 'A calendar date; one rate per day. null: from the start (at most one).' }
        cents_per_unit: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        unit: { enum: [km, mi] }
        note: { type: [string, 'null'], maxLength: 200 }
    DatedOwnMileageRatePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        effective_from: { type: [string, 'null'], format: date }
        cents_per_unit: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        unit: { enum: [km, mi] }
        note: { type: [string, 'null'], maxLength: 200 }
    Device:
      type: object
      required: [id, name, platform, created_at, last_seen_at, revoked_at]
      properties:
        id: { type: integer }
        name: { type: string }
        platform: { enum: [android, ios] }
        created_at: { $ref: '#/components/schemas/EpochMs' }
        last_seen_at: { type: [integer, 'null'] }
        revoked_at: { type: [integer, 'null'] }
        online: { type: boolean }
        clock_skew_ms: { type: [integer, 'null'], description: Last observed phone-minus-server clock difference; in memory only. }

    VehicleKind: { enum: [car, motorcycle, van, bicycle, ebike, scooter, walking], description: 'bicycle, ebike, scooter and walking are not automobiles: no mileage allowance rate applies (18 section 4.1).' }
    VehiclePower: { enum: [gas, hybrid, ev, other] }
    VehicleOwnership:
      enum: [owned, financed, leased, rented]
      description: 'Who owns the vehicle (21 section 3.6c). owned: the driver owns it. financed: the driver is buying it with instalments (car loan, hire purchase, drive-to-own). leased: a fixed-term contract; the vehicle goes back at the end. rented: short-term, by the day, week or month. A record only: no tax rule reads it.'
    VehicleCreate:
      type: object
      required: [name, kind]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 64 }
        kind: { $ref: '#/components/schemas/VehicleKind' }
        make: { type: [string, 'null'], maxLength: 64 }
        model: { type: [string, 'null'], maxLength: 64 }
        year: { type: [integer, 'null'], minimum: 1900, maximum: 2100 }
        plate: { type: [string, 'null'], maxLength: 16, description: The driver's own record; never exported unless the driver ticks it. }
        power: { oneOf: [{ $ref: '#/components/schemas/VehiclePower' }, { type: 'null' }] }
        ownership: { $ref: '#/components/schemas/VehicleOwnership', description: Left out means owned. }
    Vehicle:
      type: object
      required: [id, name, kind, make, model, year, plate, power, ownership, created_at, archived_at]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { $ref: '#/components/schemas/VehicleKind' }
        make: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        year: { type: [integer, 'null'] }
        plate: { type: [string, 'null'] }
        power: { oneOf: [{ $ref: '#/components/schemas/VehiclePower' }, { type: 'null' }] }
        ownership: { $ref: '#/components/schemas/VehicleOwnership' }
        created_at: { $ref: '#/components/schemas/EpochMs' }
        archived_at: { type: [integer, 'null'] }

    OdometerKind: { enum: [shift_start, shift_end, year_start, year_end] }
    OdometerReading:
      type: object
      required: [id, vehicle_id, shift_id, kind, reading_m, recorded_at]
      properties:
        id: { type: integer }
        vehicle_id: { type: integer }
        shift_id: { type: [integer, 'null'] }
        kind: { $ref: '#/components/schemas/OdometerKind' }
        reading_m: { type: integer, minimum: 0 }
        recorded_at: { $ref: '#/components/schemas/EpochMs' }

    Platform:
      type: object
      required: [slug, label, custom, color, emoji, active, sort, hourly_target_cents]
      properties:
        slug: { type: string }
        label: { type: string }
        custom: { type: boolean }
        color: { type: [string, 'null'] }
        emoji: { type: [string, 'null'] }
        active: { type: boolean }
        sort: { type: integer }
        hourly_target_cents: { type: [integer, 'null'], description: Used by analytics only. }
    PlatformPut:
      type: object
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 40 }
        color: { type: [string, 'null'], pattern: '^#[0-9a-f]{6}$' }
        emoji: { type: [string, 'null'], maxLength: 8 }
        active: { type: boolean }
        sort: { type: integer, minimum: 0 }
        hourly_target_cents: { type: [integer, 'null'], minimum: 0 }

    ShiftEarningsPut:
      type: object
      additionalProperties: false
      description: Omitted amounts are 0 and omitted counts are null, because the row is replaced.
      properties:
        gross_cents: { type: integer, minimum: 0 }
        tips_cents: { type: integer, minimum: 0 }
        bonus_cents: { type: integer, minimum: 0 }
        orders: { type: [integer, 'null'], minimum: 0, description: The platform's own count for the shift, typed once. }
        online_min: { type: [integer, 'null'], minimum: 0 }
        notes: { type: [string, 'null'], maxLength: 2000 }
    ShiftEarnings:
      type: object
      required: [entries, labels, effective]
      properties:
        entries:
          type: array
          items:
            type: object
            description: One row per platform. Every amount is the sum of its entries with their signs (plan 22 section 3.3).
            required: [platform, gross_cents, tips_cents, bonus_cents, fees_cents, adjustments_cents, total_cents, tax_withheld_cents, cash_collected_cents, balance_cents, orders, online_min, notes, source, edited_at, ledger]
            properties:
              platform: { type: string }
              gross_cents: { type: integer, description: Sum of fare entries. }
              tips_cents: { type: integer, description: Sum of tip entries. }
              bonus_cents: { type: integer, description: Sum of bonus entries. }
              fees_cents: { type: integer, description: Commission and platform fees; 0 or below. }
              adjustments_cents: { type: integer }
              total_cents: { type: integer, description: 'Earnings: gross + tips + bonus + fees + adjustments.' }
              tax_withheld_cents: { type: integer, description: 0 or below; not part of earnings. }
              cash_collected_cents: { type: integer, description: 0 or below; cash in the driver's hand, not part of earnings. }
              balance_cents: { type: integer, description: Sum of all entries; below 0 means the driver owes the platform. }
              ledger: { type: array, items: { $ref: '#/components/schemas/EarningEntry' } }
              orders: { type: [integer, 'null'] }
              online_min: { type: [integer, 'null'] }
              notes: { type: [string, 'null'] }
              source: { enum: [manual, import] }
              edited_at: { $ref: '#/components/schemas/EpochMs' }
        labels:
          type: array
          items:
            type: object
            required: [platform, payout_cents, tip_cents, dropoffs]
            properties:
              platform: { type: string }
              payout_cents: { type: integer }
              tip_cents: { type: integer }
              dropoffs: { type: integer }
        effective:
          type: array
          items:
            type: object
            required: [platform, gross_cents, tips_cents, bonus_cents, fees_cents, adjustments_cents, tax_withheld_cents, total_cents, orders, source]
            properties:
              platform: { type: string }
              gross_cents: { type: integer }
              tips_cents: { type: integer }
              bonus_cents: { type: integer }
              fees_cents: { type: integer, description: 0 for stop labels. }
              adjustments_cents: { type: integer }
              tax_withheld_cents: { type: integer }
              total_cents: { type: integer }
              orders: { type: [integer, 'null'] }
              source: { enum: [labels, entered, mixed] }

    EarningEntryType:
      description: 'Plan 22 section 3.2. Above 0: fare, tip, bonus, top_up. Below 0: cash_collected, commission, platform_fee, tax_withheld, payout. Either sign: adjustment.'
      enum: [fare, tip, bonus, cash_collected, commission, platform_fee, tax_withheld, top_up, payout, adjustment]
    EarningEntryCreate:
      type: object
      additionalProperties: false
      required: [type, amount_cents]
      properties:
        type: { $ref: '#/components/schemas/EarningEntryType' }
        amount_cents: { type: integer, minimum: -1000000000, maximum: 1000000000, description: 'Minor units, signed: the effect on what the platform owes the driver. Never 0.' }
        note: { type: [string, 'null'], maxLength: 2000 }
    EarningEntry:
      type: object
      required: [id, type, amount_cents, note, created_at]
      properties:
        id: { type: integer }
        type: { $ref: '#/components/schemas/EarningEntryType' }
        amount_cents: { type: integer }
        note: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/EpochMs' }
    ExpenseCreate:
      type: object
      required: [spent_on, category, amount_cents]
      additionalProperties: false
      properties:
        spent_on: { type: string, format: date, description: The driver's local date. }
        category: { type: string, description: A slug from GET /expenses/categories. }
        amount_cents: { type: integer, minimum: 1, description: Total paid, tax included. }
        merchant: { type: string, maxLength: 120 }
        deductible: { type: boolean, description: Defaults from the category. }
        business_pct: { type: integer, minimum: 0, maximum: 100, description: Defaults from the category. }
        tax_credit_cents: { type: integer, minimum: 0, description: Input tax credit portion (HST/GST/VAT); not more than the amount. }
        vehicle_id: { type: [integer, 'null'] }
        shift_id: { type: [integer, 'null'] }
        notes: { type: [string, 'null'], maxLength: 2000 }
        recurrence: { enum: [weekly, monthly, yearly, null], description: 'Makes the row a reminder template, not an expense. Needs next_due.' }
        next_due: { type: [string, 'null'], format: date }
    ExpensePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        spent_on: { type: string, format: date, description: The driver's local date. }
        category: { type: string, description: A slug from GET /expenses/categories. }
        amount_cents: { type: integer, minimum: 1, description: Total paid, tax included. }
        merchant: { type: string, maxLength: 120 }
        deductible: { type: boolean, description: Defaults from the category. }
        business_pct: { type: integer, minimum: 0, maximum: 100, description: Defaults from the category. }
        tax_credit_cents: { type: integer, minimum: 0, description: Input tax credit portion (HST/GST/VAT); not more than the amount. }
        vehicle_id: { type: [integer, 'null'] }
        shift_id: { type: [integer, 'null'] }
        notes: { type: [string, 'null'], maxLength: 2000 }
        recurrence: { enum: [weekly, monthly, yearly, null], description: 'Makes the row a reminder template, not an expense. Needs next_due.' }
        next_due: { type: [string, 'null'], format: date }
    Expense:
      type: object
      required: [id, spent_on, category, amount_cents, merchant, deductible, business_pct, tax_credit_cents, vehicle_id, shift_id, notes, recurrence, next_due, snoozed_until, template_id, deductible_cents, double_counts, has_receipt, created_at, updated_at]
      properties:
        id: { type: integer }
        spent_on: { type: string, format: date }
        category: { type: string }
        amount_cents: { type: integer }
        merchant: { type: string }
        deductible: { type: boolean }
        business_pct: { type: integer }
        tax_credit_cents: { type: integer }
        vehicle_id: { type: [integer, 'null'] }
        shift_id: { type: [integer, 'null'] }
        notes: { type: [string, 'null'] }
        recurrence: { enum: [weekly, monthly, yearly, null] }
        next_due: { type: [string, 'null'] }
        snoozed_until: { type: [string, 'null'] }
        template_id: { type: [integer, 'null'] }
        deductible_cents: { type: integer, description: 'Computed at read time: amount x business % rounded half up, 0 when not deductible.' }
        double_counts: { type: boolean, description: A standard-mileage vehicle's rate already covers this category; saved and warned about, not deducted. }
        has_receipt: { type: boolean }
        created_at: { $ref: '#/components/schemas/EpochMs' }
        updated_at: { $ref: '#/components/schemas/EpochMs' }
    ExpensePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Expense' } }
        next_cursor: { type: [string, 'null'] }
    ExpenseCategory:
      type: object
      required: [slug, label, default_deductible, default_business_pct, vehicle_related, covered_by_standard_rate]
      properties:
        slug: { type: string }
        label: { type: string }
        default_deductible: { type: boolean }
        default_business_pct: { type: integer }
        vehicle_related: { type: boolean }
        covered_by_standard_rate: { type: boolean }
    ExpenseTotals:
      type: object
      required: [year, total_cents, deductible_cents, double_counts_cents, by_category]
      properties:
        year: { type: integer }
        total_cents: { type: integer }
        deductible_cents: { type: integer, description: Without the double-counting ones. }
        double_counts_cents: { type: integer }
        by_category:
          type: array
          items:
            type: object
            required: [category, count, total_cents, deductible_cents, double_counts_cents]
            properties:
              category: { type: string }
              count: { type: integer }
              total_cents: { type: integer }
              deductible_cents: { type: integer }
              double_counts_cents: { type: integer }

    Receipt:
      type: object
      required: [expense_id, mime, bytes, sha256, created_at]
      properties:
        expense_id: { type: integer }
        mime: { enum: [image/jpeg, image/png, image/webp, application/pdf] }
        bytes: { type: integer }
        sha256: { type: string }
        created_at: { $ref: '#/components/schemas/EpochMs' }

    VehicleTaxYear:
      type: object
      required: [vehicle_id, tax_year, method, source, rate1_milli, rate2_milli, threshold_m]
      properties:
        vehicle_id: { type: integer }
        tax_year: { type: integer }
        method: { enum: [standard_mileage, actual_expenses] }
        source: { enum: [saved, default] }
        rate1_milli: { type: [integer, 'null'] }
        rate2_milli: { type: [integer, 'null'] }
        threshold_m: { type: [integer, 'null'] }
    TaxJar:
      type: object
      required: [year, balance_cents, target_cents, entries]
      properties:
        year: { type: integer }
        balance_cents: { type: integer }
        target_cents: { type: [integer, 'null'], description: Gross earnings times the set-aside rate; null without earnings. }
        entries:
          type: array
          items:
            type: object
            required: [id, amount_cents, entered_on, note]
            properties:
              id: { type: integer }
              amount_cents: { type: integer }
              entered_on: { type: string, format: date }
              note: { type: [string, 'null'] }
    TaxYear:
      type: object
      required: [year, country, region, supported, unverified, set_aside_bp, sales_tax_registered, pays_instalments, instalments_note, sales_tax_name, notices, income, deductions, estimate, deadlines, slip_alerts, jar]
      properties:
        year: { type: integer }
        country: { type: string }
        region: { type: [string, 'null'] }
        supported: { type: boolean, description: False when the country has no switched-on pack; then income, deductions and estimate are null. }
        unverified: { type: boolean, description: True while the pack's figures have not been compared with the primary publications; the screen shows an "unverified rates" notice. }
        set_aside_bp: { type: integer }
        sales_tax_registered: { type: boolean }
        pays_instalments: { type: boolean, description: The driver's own choice for this tax year, off unless set. The instalment deadlines are listed only when it is on. }
        instalments_note: { type: [string, 'null'], description: Who the tax office asks for instalments, from the country data; null when the pack says nothing. }
        sales_tax_name: { type: [string, 'null'], description: 'The sales tax of the driver''s place from the country data (GST, HST), for the "Registered for ..." choice; null when none is known.' }
        notices: { type: array, items: { type: string } }
        income:
          type: [object, 'null']
          description: Effective earnings of the year; null when none were entered or labelled.
          properties:
            gross_cents: { type: integer }
            tips_cents: { type: integer }
            bonus_cents: { type: integer }
            fees_cents: { type: integer, description: 'Commission and platform fees (plan 22), 0 or below; already taken off total_cents.' }
            adjustments_cents: { type: integer, description: Corrections to pay; part of total_cents. }
            tax_withheld_cents: { type: integer, description: 'Tax the platforms kept, 0 or below; not part of total_cents and not yet subtracted from the estimate.' }
            total_cents: { type: integer, description: 'gross + tips + bonus + fees + adjustments.' }
            by_platform: { type: array, items: { type: object, properties: { platform: { type: string }, total_cents: { type: integer } } } }
        deductions:
          type: [object, 'null']
          properties:
            expenses_cents: { type: [integer, 'null'], description: null when the expenses module is off. }
            double_counted_cents: { type: [integer, 'null'] }
            mileage_cents: { type: [integer, 'null'], description: A deduction, never cash. }
            mileage_rate: { enum: [official, yours, mixed, null], description: 'Which rate valued mileage_cents (ADR 0007); yours and mixed are never presented as official.' }
            vehicles: { type: array, items: { type: object, properties: { vehicle_id: { type: integer }, method: { enum: [standard_mileage, actual_expenses] } } } }
        estimate:
          type: [object, 'null']
          required: [net_income_cents, taxable_income_cents, lines, total_set_aside_cents, instalment_cents, sales_tax]
          properties:
            net_income_cents: { type: integer }
            taxable_income_cents: { type: integer }
            lines:
              type: array
              description: The amounts to set aside, as the country's tax pack computes them (CA, pension contribution, second band, income tax at the set-aside rate). They add up to total_set_aside_cents.
              items:
                type: object
                required: [key, label, cents, note]
                properties:
                  key: { type: string, description: Stable name, also the export row name. }
                  label: { type: string }
                  cents: { type: [integer, 'null'], description: null when not estimated here; note says why. }
                  note: { type: [string, 'null'] }
            total_set_aside_cents: { type: integer }
            instalment_cents: { type: integer }
            sales_tax:
              type: [object, 'null']
              properties:
                collected_cents: { type: integer }
                credits_cents: { type: integer }
                owing_cents: { type: integer }
                rate_bp: { type: integer }
        deadlines: { type: array, items: { type: object, properties: { date: { type: string, format: date }, kind: { enum: [instalment, balance, filing] }, label: { type: string } } } }
        slip_alerts: { type: array, items: { type: object, properties: { platform: { type: string }, total_cents: { type: integer }, threshold_cents: { type: integer }, slip: { type: string } } } }
        jar:
          type: object
          properties:
            balance_cents: { type: integer }
            target_cents: { type: [integer, 'null'] }

    ShiftStatus: { enum: [active, ended, finalized] }
    ShiftStart:
      type: object
      required: [client_id, vehicle_id, started_at]
      additionalProperties: false
      properties:
        client_id: { type: string, format: uuid }
        vehicle_id: { type: integer }
        started_at: { $ref: '#/components/schemas/EpochMs' }
        segmenter: { $ref: '#/components/schemas/Segmenter', description: 'The phone sends the value it read from its cached settings (stops_enabled). Omitted (an older phone): the server uses the current setting at receipt.' }
        notes: { type: string, maxLength: 2000 }
    Segmenter: { enum: [stops, whole_shift] }
    Shift:
      type: object
      required: [id, client_id, vehicle_id, status, segmenter, started_at, ended_at, local_date, total_m, active_m, deadhead_m, personal_m, calc_version, calculated_at, notes, deduction_cents]
      properties:
        id: { type: integer }
        client_id: { type: string, format: uuid }
        vehicle_id: { type: integer }
        status: { $ref: '#/components/schemas/ShiftStatus' }
        started_at: { $ref: '#/components/schemas/EpochMs' }
        ended_at: { type: [integer, 'null'] }
        local_date: { type: string, format: date }
        segmenter: { $ref: '#/components/schemas/Segmenter', description: 'stops = active_m and deadhead_m are ESTIMATES from detected stops (clients label them so); whole_shift = one active segment. total_m is the same either way.' }
        total_m: { type: [integer, 'null'] }
        active_m: { type: [integer, 'null'], description: Estimated when segmenter is stops. }
        deadhead_m: { type: [integer, 'null'], description: Estimated when segmenter is stops. }
        personal_m: { type: [integer, 'null'] }
        calc_version: { type: [integer, 'null'] }
        calculated_at: { type: [integer, 'null'] }
        notes: { type: [string, 'null'] }
        deduction_cents: { type: [integer, 'null'], description: Computed at read time from the country registry; never stored. }
        deduction_rate: { enum: [official, yours, null], description: 'Which rate valued deduction_cents (ADR 0007): the country''s, or your mileage rate in force on the shift''s date (always labelled "your rate"). null when there is no value.' }
        updated_at: { $ref: '#/components/schemas/EpochMs' }
        recon_status: { enum: [pending, match, differs, phone_missing] }
        recon_reasons: { type: array, items: { type: string } }
        calc_mismatch: { type: boolean }
        flags: { type: array, items: { $ref: '#/components/schemas/ShiftFlag' } }
        overlaps_shift_id: { type: [integer, 'null'], description: Set when a late upload made this shift overlap another (15 section 9.2). }
    ShiftFlag:
      type: object
      required: [code, severity]
      properties:
        code: { type: string, description: 'One of the flags in 14 section 8.' }
        severity: { enum: [info, review] }
        detail: { type: [object, 'null'] }
    PointManifest:
      type: object
      required: [first_seq, last_seq, point_count]
      additionalProperties: false
      properties:
        first_seq: { type: integer, minimum: 1 }
        last_seq: { type: integer, minimum: 1 }
        point_count: { type: integer, minimum: 0 }
    PhoneResult:
      type: object
      required: [calc_version, segmenter, input_digest, total_m, active_m, deadhead_m, personal_m, trips_count]
      additionalProperties: false
      properties:
        calc_version: { type: integer }
        segmenter: { $ref: '#/components/schemas/Segmenter' }
        input_digest: { type: string, pattern: '^[0-9a-f]{16}$' }
        total_m: { type: integer, minimum: 0 }
        active_m: { type: integer, minimum: 0 }
        deadhead_m: { type: integer, minimum: 0 }
        personal_m: { type: integer, minimum: 0 }
        trips_count: { type: integer, minimum: 0 }
    Interruption:
      type: object
      required: [from_ms, to_ms]
      additionalProperties: false
      properties:
        from_ms: { $ref: '#/components/schemas/EpochMs' }
        to_ms: { $ref: '#/components/schemas/EpochMs' }
    Recon:
      type: object
      required: [status, reasons]
      properties:
        status: { enum: [match, differs, phone_missing] }
        server_total_m: { type: integer }
        diff_m: { type: integer, description: Server total minus phone total. }
        reasons: { type: array, items: { enum: [points_missing, calc_version, edited_on_web, late_points, engine_disagreement, unknown] } }
    EndShiftResult:
      allOf:
        - { $ref: '#/components/schemas/Shift' }
        - type: object
          properties:
            recon: { $ref: '#/components/schemas/Recon' }
    ManualTripPut:
      allOf:
        - { $ref: '#/components/schemas/TripCreate' }
        - type: object
          required: [edited_at]
          properties:
            edited_at: { $ref: '#/components/schemas/EpochMs' }
    TripOverridePut:
      type: object
      required: [kind, purpose, edited_at]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/TripKind' }
        purpose: { type: string, minLength: 1, maxLength: 200 }
        edited_at: { $ref: '#/components/schemas/EpochMs' }
    ChangeEntry:
      type: object
      required: [seq, entity, op, key]
      properties:
        seq: { type: integer }
        entity: { enum: [shift, trip, odometer, vehicle, settings, override] }
        op: { enum: [upsert, delete, orphaned_override] }
        key: { type: string }
        data: { type: [object, 'null'], description: The entity in its API shape; null for delete. }
    SyncChanges:
      type: object
      required: [changes, next_cursor, has_more]
      properties:
        changes: { type: array, items: { $ref: '#/components/schemas/ChangeEntry' } }
        next_cursor: { type: integer }
        has_more: { type: boolean }
    ShiftPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Shift' } }
        next_cursor: { type: [string, 'null'] }

    Route:
      type: object
      required: [source, t, lat_e7, lon_e7]
      description: Parallel arrays of equal length. speed_dmps is null-filled for archived routes.
      properties:
        source: { enum: [raw, archive] }
        t: { type: array, items: { type: integer }, description: recorded_at in epoch ms. }
        lat_e7: { type: array, items: { type: integer } }
        lon_e7: { type: array, items: { type: integer } }
        speed_dmps: { type: array, items: { type: [integer, 'null'] } }

    TripKind: { enum: [active, deadhead, personal] }
    Trip:
      type: object
      required: [id, shift_id, kind, original_kind, source, started_at, ended_at, distance_m, purpose, edited_at]
      properties:
        id: { type: integer }
        shift_id: { type: integer }
        trip_key: { type: string }
        kind: { $ref: '#/components/schemas/TripKind' }
        original_kind: { enum: [active, deadhead] }
        source: { enum: [auto, manual] }
        started_at: { $ref: '#/components/schemas/EpochMs' }
        ended_at: { $ref: '#/components/schemas/EpochMs' }
        start_lat_e7: { type: [integer, 'null'] }
        start_lon_e7: { type: [integer, 'null'] }
        end_lat_e7: { type: [integer, 'null'] }
        end_lon_e7: { type: [integer, 'null'] }
        distance_m: { type: integer, minimum: 0 }
        purpose: { type: string }
        edited_at: { type: [integer, 'null'] }
    TripCreate:
      type: object
      required: [kind, started_at, ended_at, distance_m, purpose]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/TripKind' }
        started_at: { $ref: '#/components/schemas/EpochMs' }
        ended_at: { $ref: '#/components/schemas/EpochMs' }
        distance_m: { type: integer, minimum: 1 }
        purpose: { type: string, minLength: 1, maxLength: 200 }
    TripEditResult:
      type: object
      required: [trip, shift]
      properties:
        trip: { oneOf: [{ $ref: '#/components/schemas/Trip' }, { type: 'null' }], description: Null only for a trip override whose trip_key matches no trip (reported as override_orphaned). }
        shift: { $ref: '#/components/schemas/Shift' }

    StopRole: { enum: [pickup, dropoff, other] }
    StopConfidence: { enum: [low, medium, high] }
    StopLabelPut:
      type: object
      required: [role, edited_at]
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/StopRole' }
        platform: { type: [string, 'null'], pattern: '^[a-z0-9_]{1,32}$' }
        place: { type: [string, 'null'], maxLength: 120 }
        payout_cents: { type: integer, minimum: 0, default: 0 }
        tip_cents: { type: integer, minimum: 0, default: 0 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        edited_at: { $ref: '#/components/schemas/EpochMs' }
    StopLabel:
      allOf:
        - { $ref: '#/components/schemas/StopLabelPut' }
        - type: object
          required: [stop_key, shift_id]
          properties:
            stop_key: { type: string }
            shift_id: { type: integer }
    Stop:
      type: object
      required: [stop_key, shift_id, started_at, ended_at, dwell_s, lat_e7, lon_e7, confidence, est_role, role, label]
      description: A derived stop (14 section 6). Never written by a client.
      properties:
        stop_key: { type: string }
        shift_id: { type: integer }
        started_at: { $ref: '#/components/schemas/EpochMs' }
        ended_at: { $ref: '#/components/schemas/EpochMs' }
        dwell_s: { type: integer, minimum: 0 }
        lat_e7: { type: integer }
        lon_e7: { type: integer }
        confidence: { $ref: '#/components/schemas/StopConfidence' }
        est_role: { enum: [pickup, dropoff, none], description: The engine's estimate; none = recorded but does not change the estimate. }
        role: { enum: [pickup, dropoff, other, none], description: The role used, the driver's label if any else est_role. }
        label: { oneOf: [{ $ref: '#/components/schemas/StopLabel' }, { type: 'null' }] }
    StopLabelResult:
      type: object
      required: [stop, shift]
      properties:
        stop:
          oneOf: [{ $ref: '#/components/schemas/Stop' }, { type: 'null' }]
          description: Null only when DELETE cleared a label whose stop no longer exists (label_orphaned).
        shift: { $ref: '#/components/schemas/Shift' }

    TelemetryPoint:
      type: object
      required: [seq, recorded_at, lat_e7, lon_e7, accuracy_m]
      additionalProperties: false
      properties:
        seq: { type: integer, minimum: 1 }
        recorded_at: { $ref: '#/components/schemas/EpochMs' }
        lat_e7: { type: integer, minimum: -900000000, maximum: 900000000 }
        lon_e7: { type: integer, minimum: -1800000000, maximum: 1800000000 }
        accuracy_m: { type: integer, minimum: 0 }
        speed_dmps: { type: [integer, 'null'], minimum: 0 }
        bearing_deg: { type: [integer, 'null'], minimum: 0, maximum: 359 }
        altitude_m: { type: [integer, 'null'] }
    TelemetryBatch:
      type: object
      required: [shift_client_id, points]
      additionalProperties: false
      properties:
        shift_client_id: { type: string, format: uuid }
        points: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/TelemetryPoint' } }
    TelemetryBatchResult:
      type: object
      required: [inserted, duplicates, rejected, server_time, upload_hint_s]
      properties:
        inserted: { type: integer, minimum: 0 }
        duplicates: { type: integer, minimum: 0 }
        rejected:
          type: array
          description: Permanently refused points. Everything not listed here is stored.
          items:
            type: object
            required: [seq, code]
            properties:
              seq: { type: integer }
              code: { enum: [invalid_coordinate, future_timestamp, outside_shift_window] }
        server_time: { $ref: '#/components/schemas/EpochMs' }
        upload_hint_s: { type: integer, minimum: 10, maximum: 300, description: Suggested seconds until the next upload (60). }

    Summary:
      type: object
      required: [from, to, shift_count, hours, earnings_cents, tips_cents, active_m, deadhead_m, personal_m, total_m, deduction_cents, hourly_earnings_cents]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        shift_count: { type: integer }
        hours: { type: number }
        earnings_cents: { type: [integer, 'null'], description: Effective earnings (18 section 4.3) - the driver's typed totals, else the stop labels' payout plus tips; null when nothing was entered or labelled, never 0. }
        tips_cents: { type: [integer, 'null'] }
        active_m: { type: integer }
        deadhead_m: { type: integer }
        personal_m: { type: integer }
        total_m: { type: integer }
        deduction_cents: { type: [integer, 'null'], description: null when the selected country has no registered pack. }
        deduction_rate: { enum: [official, yours, mixed, null], description: 'Which rate valued the period''s deduction (ADR 0007): the country''s, your own, or both by date (mixed). null when there is no value.' }
        hourly_earnings_cents: { type: [integer, 'null'], description: earnings_cents divided by hours; null when hours is 0. }
        platform_filter: { const: earnings_only, description: Present only when the platform query was given. }

    SummarySeries:
      type: object
      required: [from, to, bucket, buckets]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        bucket: { enum: [day, month] }
        buckets: { type: array, items: { $ref: '#/components/schemas/SeriesBucket' } }
    SeriesBucket:
      type: object
      required: [start, shift_count, hours, earnings_cents, tips_cents, active_m, deadhead_m, personal_m, total_m, unsplit_m, platforms]
      properties:
        start: { type: string, format: date, description: The bucket's first day (the first of the month by month). }
        shift_count: { type: integer }
        hours: { type: number, description: Shift time. }
        earnings_cents: { type: [integer, 'null'], description: 'As Summary.earnings_cents; null when the bucket has shifts but nothing entered or labelled, or nothing can count as earnings. 0 with no shifts and no earnings.' }
        tips_cents: { type: [integer, 'null'] }
        active_m: { type: integer, description: Includes unsplit_m. }
        deadhead_m: { type: integer }
        personal_m: { type: integer }
        total_m: { type: integer }
        unsplit_m: { type: integer, description: Business distance of shifts with no stop-based split; it is counted in active_m. The rest of active_m and deadhead_m are estimates from detected stops. }
        platforms:
          type: array
          description: Earnings per platform in the bucket, largest first.
          items:
            type: object
            required: [platform, earnings_cents, tips_cents]
            properties:
              platform: { type: string }
              earnings_cents: { type: integer }
              tips_cents: { type: integer }
    Backup:
      type: object
      required: [id, created_at, size_bytes, sha256, integrity_ok, trigger]
      properties:
        id: { type: integer }
        created_at: { $ref: '#/components/schemas/EpochMs' }
        size_bytes: { type: integer }
        sha256: { type: string }
        integrity_ok: { type: boolean }
        trigger: { enum: [nightly, shift_end, manual, pre_migration, pre_restore] }
    NewRecoveryKeyRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string, minLength: 1, description: The owner's password, asked again before the key changes. }
    NewRecoveryKey:
      type: object
      required: [recovery_key, state]
      properties:
        recovery_key: { type: string, description: age private key; never stored on the server. }
        state: { const: needs_confirmation }
    NewRecoveryKeyConfirmed:
      type: object
      required: [state, backup]
      properties:
        state: { const: ready }
        backup:
          description: The first backup under the new key, or null when it failed (the key change stands; run a backup again).
          oneOf:
            - { $ref: '#/components/schemas/Backup' }
            - { type: 'null' }
    OffsiteState:
      type: object
      required: [last_download_at, synced_elsewhere_at, reminder_due]
      properties:
        last_download_at: { type: [integer, 'null'] }
        synced_elsewhere_at: { type: [integer, 'null'] }
        reminder_due: { type: boolean }
    RestoreVerification:
      type: object
      required: [integrity_ok, schema_version, shift_count, stop_label_count, point_count]
      properties:
        integrity_ok: { type: boolean }
        schema_version: { type: integer }
        shift_count: { type: integer }
        stop_label_count: { type: integer }
        point_count: { type: integer }
        first_shift_at: { type: [integer, 'null'] }
        last_shift_at: { type: [integer, 'null'] }
        latest_shift_total_m: { type: [integer, 'null'] }
    SystemStatus:
      type: object
      required: [app_version, schema_version, sqlite_version, db_bytes, wal_bytes, disk_free_bytes, disk_state, last_backup, last_backup_failure, offsite, paired_device_count, mode]
      properties:
        app_version: { type: string }
        schema_version: { type: integer }
        sqlite_version: { type: string }
        db_bytes: { type: integer }
        wal_bytes: { type: integer }
        disk_free_bytes: { type: integer }
        disk_state: { enum: [ok, warning, backup_skipped, writes_blocked] }
        last_backup: { oneOf: [{ $ref: '#/components/schemas/Backup' }, { type: 'null' }] }
        last_backup_failure:
          description: The last backup run, when it failed and no run has succeeded since. Failed runs make no backup, so they are not in GET /backups. Kept in memory, so a restart clears it.
          oneOf:
            - type: object
              required: [at, message]
              properties:
                at: { $ref: '#/components/schemas/EpochMs' }
                message: { type: string, description: The server's reason, in English. }
            - { type: 'null' }
        offsite: { $ref: '#/components/schemas/OffsiteState' }
        paired_device_count: { type: integer }
        mode: { enum: [normal, read_only, restoring] }
        diagnostics:
          type: object
          description: Present when the diagnostics module is on (16 section 7.2).
          properties:
            level: { enum: [off, basic, verbose] }
            db_bytes: { type: integer }
            event_count: { type: integer }
    DiagnosticsSettings:
      type: object
      required: [level, verbose_until]
      properties:
        level: { enum: [off, basic, verbose] }
        verbose_until: { type: [integer, 'null'], description: Epoch ms; verbose reverts to basic then. }
    DiagEventIn:
      type: object
      required: [kind, at, level, src, v, data]
      additionalProperties: false
      properties:
        kind: { type: string, maxLength: 40, pattern: '^[a-z_]+\.[a-z_]+$' }
        at: { $ref: '#/components/schemas/EpochMs' }
        level: { enum: [basic, verbose] }
        src: { enum: [phone_native, phone_js, server, web] }
        seq: { type: integer, minimum: 1, description: Required for phone sources; strictly increasing per (device, src). }
        shift: { type: string, format: uuid, description: Shift client_id. }
        v: { type: string, maxLength: 40, pattern: '^[0-9A-Za-z._+-]{1,40}$' }
        data: { type: object, description: 'Typed fields defined per kind in the shared package registry (16 section 3.2). Unknown fields are rejected. Never a coordinate, address, payout, label or free text (16 section 4).' }
    DiagIngestRequest:
      type: object
      required: [events]
      additionalProperties: false
      properties:
        events: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/DiagEventIn' } }
    DiagIngestResult:
      type: object
      required: [accepted, duplicates, discarded, rejected]
      properties:
        accepted: { type: integer }
        duplicates: { type: integer }
        discarded: { type: integer, description: Verbose events accepted but not stored because disk is low. }
        rejected:
          type: array
          items:
            type: object
            required: [index, reason]
            properties:
              index: { type: integer }
              reason: { enum: [unknown_kind, schema, pattern, level, scope, seq_required] }
    DiagEvent:
      type: object
      required: [id, src, at, received_at, level, kind, data]
      properties:
        id: { type: integer }
        src: { enum: [phone_native, phone_js, server, web] }
        device_id: { type: [integer, 'null'] }
        seq: { type: [integer, 'null'] }
        at: { $ref: '#/components/schemas/EpochMs' }
        received_at: { $ref: '#/components/schemas/EpochMs' }
        level: { enum: [basic, verbose] }
        kind: { type: string }
        shift: { type: [string, 'null'] }
        v: { type: [string, 'null'] }
        data: { type: object }
    DiagEventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DiagEvent' } }
        next_cursor: { type: [string, 'null'] }
    HealthCheck:
      type: object
      required: [id, label, state]
      properties:
        id: { type: string, description: 'H1 to H7 (device checks) or S1 to S5 (server checks), 16 section 10.1.' }
        label: { type: string }
        weight: { type: integer, description: Points toward the 0 to 100 score; absent for server checks. }
        value: { type: [number, 'null'] }
        unit: { type: string }
        state: { enum: [green, amber, red, na] }
    DeviceHealth:
      type: object
      required: [device_id, name, shifts_considered, score, state, checks]
      properties:
        device_id: { type: integer }
        name: { type: string }
        shifts_considered: { type: integer }
        score: { type: integer, minimum: 0, maximum: 100 }
        state: { enum: [green, amber, red, na] }
        checks: { type: array, items: { $ref: '#/components/schemas/HealthCheck' } }
    ServerHealth:
      type: object
      required: [state, checks]
      properties:
        state: { enum: [green, amber, red, na] }
        checks: { type: array, items: { $ref: '#/components/schemas/HealthCheck' } }
    DiagnosticsHealth:
      type: object
      required: [generated_at, devices, server]
      properties:
        generated_at: { $ref: '#/components/schemas/EpochMs' }
        devices: { type: array, items: { $ref: '#/components/schemas/DeviceHealth' } }
        server: { $ref: '#/components/schemas/ServerHealth' }
