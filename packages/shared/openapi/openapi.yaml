  /progress:
    get:
      tags: [progress]
      operationId: getProgress
      summary: XP, level, streak, freezes, this week's challenges and the badge grid. Evaluates and records new unlocks (idempotent); everything else is derived.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Progress now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progress' }

  /exports/{format}:
    get:
      tags: [exports]
      operationId: exportData
      summary: Download a file from a registered exporter (v1 ships csv, pdf, gpx, geojson). A disabled or unknown format returns 404.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: format, in: path, required: true, schema: { enum: [csv, pdf, gpx, geojson, expenses, tax_summary] }, description: 'Only formats whose exporter is registered and enabled exist. expenses and tax_summary are reports over records, not shifts: from/to are optional for expenses, year selects the tax year, format=json is for tax_summary only.' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: shift_id, in: query, schema: { type: integer }, description: Alternative to from/to. }
        - { name: vehicle_id, in: query, schema: { type: integer } }
        - { name: level, in: query, description: "CSV only.", schema: { enum: [trip, shift], default: trip } }
        - { name: year, in: query, schema: { type: integer }, description: Tax year for tax_summary and the default year of expenses. }
        - { name: category, in: query, schema: { type: string }, description: expenses only. }
        - { name: format, in: query, schema: { enum: [csv, json], default: csv }, description: tax_summary only. }
      responses:
        '200':
          description: The file, streamed.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            text/csv: { schema: { type: string } }
            application/pdf: { schema: { type: string, contentMediaType: application/pdf } }
            application/gpx+xml: { schema: { type: string } }
            application/geo+json: { schema: { type: object } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /backups:
    get:
      tags: [backups]
      operationId: listBackups
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Backups on disk with the result of their verification.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Backup' } }
    post:
      tags: [backups]
      operationId: runBackup
      summary: Run a verified backup now (rate-limited to once per 15 minutes).
      security: [{ sessionCookie: [] }]
      responses:
        '201':
          description: Backup written and verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backup' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
  /backups/{id}/download:
    get:
      tags: [backups]
