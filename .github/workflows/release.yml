# Release builds. On a `v*` tag, or by hand with a tag name: the server and Caddy images for
# linux/amd64 and linux/arm64 (Raspberry Pi), pushed to GitHub's container registry as
# ghcr.io/<owner>/milewage/server and ghcr.io/<owner>/milewage/caddy, tagged with the version and
# `latest`. infra/docker/docker-compose.release.yml runs them with
# MILEWAGE_IMAGE_REPO=ghcr.io/<owner>/milewage and MILEWAGE_VERSION=<tag>.
# The phone APK is built on the owner's machine (scripts/phone-release-build.sh), because it needs
# the upload keystore, and attached to the GitHub release by hand.
# infra/github-actions.test.mjs checks the shape of this file.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build, for example v0.1.0 (must exist and match VERSION)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # Registry paths are lower case; the repository name is not.
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/milewage
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: The tag must be the VERSION file
        run: |
          version="v$(tr -d ' \n' < VERSION)"
          test "$version" = "$TAG" || { echo "VERSION says $version, the tag is $TAG" >&2; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/server:${{ env.TAG }}
            ${{ env.IMAGE_REPO }}/server:latest
          # Links the package to this repository, so it shows on the repo page and follows its visibility.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: caddy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/caddy:${{ env.TAG }}
            ${{ env.IMAGE_REPO }}/caddy:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
