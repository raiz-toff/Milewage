            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Vehicle' } }
    post:
      tags: [vehicles]
      operationId: createVehicle
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /vehicles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [vehicles]
      operationId: updateVehicle
      summary: Rename, edit details, or archive/unarchive. Vehicles are never deleted. Archiving the default vehicle clears the default.
      security: [{ sessionCookie: [] }]
      requestBody:
