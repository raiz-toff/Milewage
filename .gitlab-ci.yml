# The contract is `npm run verify`. CI runs exactly that (roadmap 17 T11, T12).
# Requires a registered GitLab runner with the Docker executor; none is registered yet.
# Release tags are `v<VERSION>` (for example v0.1.0): they also build the images and, on request,
# the phone app. infra/ci.test.mjs checks the shape of this file.
stages:
  - test
  - build

verify:
  image: node:22.22.0-bookworm-slim
  stage: test
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - node -v
    - npm ci --cache .npm --prefer-offline
    - npm run verify
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/

# Known vulnerabilities in the production dependencies, high and critical only.
# allow_failure: it reports but does not block yet; it becomes blocking (delete allow_failure) once
# the baseline is clean. Baseline on 2026-11-08: 2 low and 9 moderate, none high.
audit:
  image: node:22.22.0-bookworm-slim
  stage: test
  allow_failure: true
  script:
    - npm audit --omit=dev --audit-level=high
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/

# Multi-arch images for infra/docker/docker-compose.release.yml, pushed to this project's container
# registry: server (the last stage of infra/docker/Dockerfile) and caddy (its `caddy` target), each as
# :<tag> and :latest, for linux/amd64 and linux/arm64 (Raspberry Pi). Docker-in-Docker needs a
# runner with `privileged = true`; arm64 is built under QEMU, which binfmt installs first.
images:
  stage: build
  needs: [verify]
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: /certs/client
    PLATFORMS: linux/amd64,linux/arm64
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    - docker buildx create --name milewage --driver docker-container --use
    - docker buildx inspect --bootstrap
  script:
    - >-
      docker buildx build --platform "$PLATFORMS" -f infra/docker/Dockerfile
      -t "$CI_REGISTRY_IMAGE/server:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE/server:latest"
      --push .
    - >-
      docker buildx build --platform "$PLATFORMS" -f infra/docker/Dockerfile --target caddy
      -t "$CI_REGISTRY_IMAGE/caddy:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE/caddy:latest"
      --push .
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# The release APK, built on request from a tag by scripts/phone-release-build.sh and kept as an
# artifact. NOTE: no runner tagged `android` exists yet; it needs Node 22.22, JDK 17 and the Android
# SDK (ANDROID_HOME), like the `coder` machine. Signing: set MILEWAGE_KEYSTORE_ENV as a protected
# File variable holding keystore.env (scripts/phone-keystore.sh) with MILEWAGE_KEYSTORE_PATH pointing
# at the keystore on that runner; without it the APK carries the debug key. versionCode is the
# pipeline's project-wide number, which only grows. After the build the manifest tests check the
# merged release manifest (no forbidden permission, no ML Kit, sees Tailscale, only known
# permissions); `verify` runs before any build, where those checks skip. With
# MILEWAGE_REQUIRE_MERGED_MANIFEST=1 a missing or stale merged manifest fails the job too.
phone-apk:
  stage: build
  needs: [verify]
  tags: [android]
  variables:
    MILEWAGE_VERSION_CODE: $CI_PIPELINE_IID
  script:
    - scripts/phone-release-build.sh
    - MILEWAGE_REQUIRE_MERGED_MANIFEST=1 npm test -w apps/phone -- test/manifest.test.ts
  artifacts:
    name: milewage-$CI_COMMIT_TAG-apk
    paths:
      - apps/phone/android/app/build/outputs/apk/release/app-release.apk
    expire_in: never
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual
      # A manual job would otherwise hold the tag pipeline as "blocked".
      allow_failure: true
