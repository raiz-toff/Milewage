openapi: 3.1.0
info:
  title: MileWage API
  version: 1.0.0
  summary: Self-hosted mileage tracking server for gig riders and drivers (single driver per instance).
  description: >
    Contract between the MileWage server, the Android app and the web client.
    Units: timestamps are UTC epoch milliseconds, distances are integer metres,
    money is integer cents, coordinates are integer degrees x 10^7.
    Errors are RFC 9457 problem+json. See plan 08, the API spec kept in the git history, for the rules
    that OpenAPI cannot express (offline upload contract, WebSocket protocol, scopes).
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - deviceBearer: []
tags:
  - { name: setup }
  - { name: auth }
  - { name: devices }
  - { name: settings }
  - { name: countries }
  - { name: vehicles }
  - { name: shifts }
  - { name: stops }
  - { name: trips }
  - { name: telemetry }
  - { name: exports }
  - { name: backups }
  - { name: sync }
  - { name: diagnostics }
  - { name: platforms }
  - { name: earnings }
  - { name: expenses }
  - { name: receipts }
  - { name: tax }
  - { name: goals }
  - { name: analytics }
  - { name: maintenance }
  - { name: import }
  - { name: notifications }
  - { name: mcp }
  - { name: system }

x-modules:
  core:
    toggle: never
    operations: [getHealth, getSetupStatus, listCountries, getErrorType, createOwner, confirmRecoveryKey, login, logout, changePassword, resetPassword, getSettings, updateSettings, listVehicles, createVehicle, updateVehicle, getSystemStatus, getSummary, getSummarySeries, listShifts, startShift, getShift, updateShift, purgeShift, endShift, finalizeShift, recalculateShift, setShiftOdometer, listOdometerReadings, createYearOdometerReading, deleteOdometerReading, listShiftTrips, putManualTrip, updateTrip, deleteManualTrip, listOwnMileageRates, createOwnMileageRate, updateOwnMileageRate, deleteOwnMileageRate]
  devices:
    toggle: modules.devices
    default: true
    dependsOn: [core]
    operations: [createPairingToken, redeemPairingToken, listDevices, renameDevice, revokeDevice, getAppInfo, downloadAndroidApp, checkAndroidApp, createLinkRequest, pollLinkRequest, listLinkRequests, approveLinkRequest, denyLinkRequest]
  tracking:
    toggle: modules.tracking
    default: true
    dependsOn: [core, devices]
    operations: [uploadTelemetryBatch, putTripOverride]
  sync:
    toggle: modules.sync
    default: true
    dependsOn: [core, devices]
    operations: [pullChanges]
  # local_export (v1.1): toggle modules.local_export, default false. Its restore route is not part of the v1 contract (15 section 9.1).
  replay:
    toggle: modules.replay
    default: true
    dependsOn: [tracking]
    operations: [getShiftRoute]
  stops:
    toggle: settings.stops_enabled   # the one runtime toggle: a driver-facing setting, not a restart-time config switch (section 16.1)
    default: true
    dependsOn: [core, tracking]
    operations: [listShiftStops, putStopLabel, deleteStopLabel, listPlaces, createPlace, updatePlace, deletePlace]
  exporters:
    toggle: modules.export_<format>
    default: true
    dependsOn: [core]
    operations: [exportData]
    registry: { csv: [core], pdf: [core], gpx: [core, tracking], geojson: [core, tracking], expenses: [expenses], tax_summary: [tax] }
  backup:
    toggle: engine is not toggleable; backup.on_shift_end, backup.download
    default: true
    dependsOn: [core]
    operations: [listBackups, runBackup, downloadBackup, setOffsiteAck, restoreOnFreshInstance, createRecoveryKey, confirmNewRecoveryKey]
  diagnostics:
    toggle: modules.diagnostics   # plus settings.diagnostics_level (off, basic, verbose); 16 section 5
    default: true
    dependsOn: [core]
    operations: [ingestDiagnosticEvents, listDiagnosticEvents, getDiagnosticsHealth, downloadDebugBundle]
  capture:
    toggle: modules.capture
    default: false
    dependsOn: [diagnostics, tracking, devices]
    operations: [createCaptureSession, listCaptureSessions, updateCaptureSession, deleteCaptureSession, downloadCaptureReplay, uploadCaptureFixes, putCaptureAnnotation, deleteCaptureAnnotation]
  platforms:
    toggle: modules.platforms
    default: true
    dependsOn: [core]
    operations: [listPlatforms, putPlatform, deletePlatform, putPlatformLogo, getPlatformLogo, deletePlatformLogo]
  earnings:
    toggle: modules.earnings
    default: true
    dependsOn: [core]
    operations: [listShiftEarnings, putShiftEarnings, deleteShiftEarnings, addEarningEntry, deleteEarningEntry]
  expenses:
    toggle: modules.expenses
    default: true
    dependsOn: [core]
    operations: [listExpenses, createExpense, getExpense, updateExpense, deleteExpense, getExpenseTotals, listExpenseMerchants, getDueExpenses, confirmDueExpense, snoozeExpense, listExpenseCategories]
  receipts:
    toggle: modules.receipts
    default: true
    dependsOn: [expenses]
    operations: [putExpenseReceipt, getExpenseReceipt, deleteExpenseReceipt]
  tax:
    toggle: modules.tax
    default: true
    dependsOn: [core]
    operations: [getTaxYear, updateTaxYear, getTaxJar, addTaxJarEntry, deleteTaxJarEntry, getVehicleTaxYear, putVehicleTaxYear, deleteVehicleTaxYear]
  goals:
    toggle: modules.goals
    default: true
    dependsOn: [core]
    operations: [listGoals, createGoal, updateGoal, deleteGoal]
  analytics:
    toggle: modules.analytics
    default: true
    dependsOn: [core]
    operations: [getAnalytics, getAnalyticsBreakdown]
  maintenance:
    toggle: modules.maintenance
    default: true
    dependsOn: [core]
    operations: [listMaintenance, createMaintenance, updateMaintenance, deleteMaintenance]
  import:
    toggle: modules.import
    default: true
    dependsOn: [core]
    operations: [previewImport, commitImport, previewMileIqImport, commitMileIqImport]
  notifications:
    toggle: modules.notifications
    default: true
    dependsOn: [core]
    operations: [listNotifications, markNotificationRead, dismissNotification, getNotificationPrefs, updateNotificationPrefs]
  mcp:
    toggle: modules.mcp
    default: true
    dependsOn: [core]
    operations: [listMcpTokens, createMcpToken, revokeMcpToken, replaceMcpToken, listMcpAudit, checkMcpConnection, getOAuthAuthorization, decideOAuthAuthorization]

paths:
  /healthz:
    servers: [{ url: / }]
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness check (unauthenticated, reveals nothing else)
      security: []
      responses:
        '200':
          description: Database answers a trivial read.
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { const: true } } }
        '503': { description: Not healthy. }

  /setup/status:
    get:
      tags: [setup]
      operationId: getSetupStatus
      security: []
      responses:
        '200':
          description: Instance state.
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: { enum: [needs_setup, needs_confirmation, ready] }
  /setup:
    post:
      tags: [setup]
      operationId: createOwner
      summary: Create the owner account. Works only while no users exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupRequest' }
      responses:
        '201':
          description: Account created; session cookie set. The recovery key is shown once.
          content:
            application/json:
              schema:
                type: object
                required: [recovery_key, state]
                properties:
                  recovery_key: { type: string, description: age private key; never stored on the server. }
                  state: { const: needs_confirmation }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /setup/confirm:
    post:
      tags: [setup]
      operationId: confirmRecoveryKey
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [last6]
              additionalProperties: false
              properties:
                last6: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200':
          description: Setup complete; backups start.
          content:
            application/json:
              schema: { type: object, required: [state], properties: { state: { const: ready } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /setup/restore:
    post:
      tags: [setup]
      operationId: restoreOnFreshInstance
      summary: Restore a backup onto a fresh instance. Refused if any user exists (use milewage-cli restore).
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, recovery_key]
              properties:
                file: { type: string, contentMediaType: application/octet-stream, description: "The .db.gz.age backup file (up to 512 MiB on this route only)." }
                recovery_key: { type: string }
      responses:
        '200':
          description: Restored. Verification output as in 10-backup-restore-and-ops-spec §7.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestoreVerification' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /countries:
    get:
      tags: [countries]
      operationId: listCountries
      summary: The countries a driver may choose, with their regions and what each supports (plan 21 section 3.9). Public, so first-run setup can list them.
      security: []
      responses:
        '200':
          description: Countries in the order screens list them.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Country' } }
  /errors/{code}:
    get:
      tags: [system]
      operationId: getErrorType
      summary: What an error code means. This is where the `type` URI of a problem points. Public.
      security: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, description: 'An error code such as shift_finalized.' }
      responses:
        '200':
          description: The catalogue entry.
          content:
            application/json:
              schema:
                type: object
                required: [code, title, status, description]
                properties:
                  code: { type: string }
                  title: { type: string }
                  status: { type: integer }
                  description: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '204':
          description: Session cookie mw_session set.
          headers:
            Set-Cookie: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Forgot the password. The recovery key proves it is the owner; sets a new password, signs out every browser and signs this one in. 5 wrong keys per client and 20 in all per 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recovery_key, new_password]
              additionalProperties: false
              properties:
                recovery_key: { type: string, maxLength: 200, description: 'AGE-SECRET-KEY-1…, as shown at setup. Never stored.' }
                new_password: { type: string, minLength: 10 }
      responses:
        '204':
          description: Password changed; session cookie mw_session set.
          headers:
            Set-Cookie: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Session ended. }
  /auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              additionalProperties: false
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10 }
      responses:
        '204': { description: Changed; all other sessions invalidated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /pairing-tokens:
    post:
      tags: [devices]
      operationId: createPairingToken
      security: [{ sessionCookie: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                base_url: { type: string, description: "The driver's correction of the address (plan 19 section 3.2): an absolute https URL with no path, query or credentials; plain http only to a home address (plan 28: private IPv4 and IPv6 ranges, .local, .lan, .home.arpa), which then becomes home_url, or anywhere on a development server." }
      responses:
        '201':
          description: One-time token, valid 10 minutes.
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at, qr_payload, pair_url, base_url, base_url_source, home_url, away_url]
                properties:
                  token: { type: string, pattern: '^mwp_[A-Za-z0-9_-]{43}$' }
                  expires_at: { $ref: '#/components/schemas/EpochMs' }
                  qr_payload: { type: string, description: "milewage://pair?v=1&u=<server url>&t=<token>[&h=<home url>]: the link that opens the phone app (Open in the MileWage app, the code text). h (plan 28) is there when the home address differs from u; older apps ignore it." }
                  pair_url: { type: string, description: "<server url>/pair#v=1&t=<token>[&h=<home url>]: what the QR shows (plan 24 Q1), with the same h as qr_payload. The phone app reads it; any other camera opens the server's pair page, which links to the app. The token is in the fragment, so it never reaches a server log." }
                  base_url: { type: string, description: "The server address inside the code (u), without a trailing slash: away_url, else home_url, else this request's address." }
                  base_url_source: { enum: [configured, request, driver], description: "Where base_url came from: MILEWAGE_PUBLIC_URL or MILEWAGE_HOME_URL, the address of this request (as the browser sees it), or the driver's base_url." }
                  home_url: { type: [string, 'null'], description: "Plan 28: the server on the home network (http allowed): the driver's home address, MILEWAGE_HOME_URL, or this request's address when it is a home address." }
                  away_url: { type: [string, 'null'], description: "Plan 28: the https address used away from home: the driver's, MILEWAGE_PUBLIC_URL, or this request's when it is https and not a home address." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /app:
    get:
      tags: [devices]
      operationId: getAppInfo
      summary: What the public download page shows (no sign-in, the phone has no account yet). The app file is looked at on every request, so a new one is offered without a restart.
      security: []
      responses:
        '200':
          description: The app file on this server (or null), the store page (or null) and the download page's address.
          content:
            application/json:
              schema:
                type: object
                required: [apk, store_url, page_url, base_url, base_url_source]
                properties:
                  apk:
                    oneOf:
                      - type: 'null'
                      - type: object
                        required: [size_bytes, updated_at, version]
                        properties:
                          size_bytes: { type: integer, minimum: 0 }
                          updated_at: { $ref: '#/components/schemas/EpochMs' }
                          version: { type: [string, 'null'], description: "From <file>.json, written by scripts/phone-release-build.sh --publish; null without it." }
                  store_url: { type: [string, 'null'], description: MILEWAGE_APP_STORE_URL (an https link to the store page); null until the app is published. }
                  page_url: { type: string, description: "<base_url>/app: the download page, for a QR code." }
                  base_url: { type: string }
                  base_url_source: { enum: [configured, request] }
  /app/android.apk:
    get:
      tags: [devices]
      operationId: downloadAndroidApp
      summary: The Android app this server hands out (plan 24 Q2). No sign-in. A 404 when the owner has not put the file in place (MILEWAGE_APK_PATH, default <config>/milewage.apk).
      security: []
      responses:
        '200':
          description: The APK file.
          content:
            application/vnd.android.package-archive: { schema: { type: string, contentMediaType: application/vnd.android.package-archive } }
        '404': { $ref: '#/components/responses/NotFound' }
    head:
      tags: [devices]
      operationId: checkAndroidApp
      summary: Whether the app file is there, without downloading it (the web shows Get the app only then).
      security: []
      responses:
        '200': { description: The file is there. }
        '404': { description: No app file on this server. }
  /pairing/redeem:
    post:
      tags: [devices]
      operationId: redeemPairingToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, device_name, platform]
              additionalProperties: false
              properties:
                token: { type: string }
                device_name: { type: string, maxLength: 64 }
                platform: { enum: [android, ios] }
                app_version: { type: string, maxLength: 32 }
      responses:
        '201':
          description: Device created. The credential is returned once and never again.
          content:
            application/json:
              schema:
                type: object
                required: [device_id, device_token, settings]
                properties:
                  device_id: { type: integer }
                  device_token: { type: string, pattern: '^mwd_[A-Za-z0-9_-]{43}$' }
                  settings: { $ref: '#/components/schemas/Settings' }
                  home_url: { type: [string, 'null'], description: "Plan 28: the server's home-network address as this server knows it (null when unknown); absent from older servers." }
                  away_url: { type: [string, 'null'], description: "Plan 28: the server's https address for away from home (null when unknown); absent from older servers." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /link-requests:
    post:
      tags: [devices]
      operationId: createLinkRequest
      summary: "Plan 28: a phone that found this server on the Wi-Fi asks to link (RFC 8628 shape). It shows user_code; the driver types it on the web. No sign-in. At most 5 waiting phones per client address and 20 in all; requests live 10 minutes, in memory."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_name, platform]
              additionalProperties: false
              properties:
                device_name: { type: string, minLength: 1, maxLength: 64 }
                platform: { enum: [android, ios] }
      responses:
        '201':
          description: Waiting for the driver.
          content:
            application/json:
              schema:
                type: object
                required: [device_code, user_code, expires_in, interval]
                properties:
                  device_code: { type: string, pattern: '^mwl_[A-Za-z0-9_-]{43}$', description: The phone's secret for polling; never shown. }
                  user_code: { type: string, pattern: '^[0-9]{6}$', description: Shown on the phone; typed on the web. }
                  expires_in: { type: integer, description: Seconds. }
                  interval: { type: integer, description: Seconds to wait between polls. }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [devices]
      operationId: listLinkRequests
      summary: Phones waiting to link, for the web (never their codes).
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Waiting phones, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, device_name, platform, from, created_at, expires_at]
                  properties:
                    id: { type: integer }
                    device_name: { type: string }
                    platform: { enum: [android, ios] }
                    from: { type: string, description: The client address the phone asked from. }
                    created_at: { $ref: '#/components/schemas/EpochMs' }
                    expires_at: { $ref: '#/components/schemas/EpochMs' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /link-requests/poll:
    post:
      tags: [devices]
      operationId: pollLinkRequest
      summary: The phone asks whether the driver typed its code. No sign-in; the device_code is the secret.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code]
              additionalProperties: false
              properties:
                device_code: { type: string }
      responses:
        '201':
          description: Linked, once. The same body as POST /pairing/redeem.
          content:
            application/json:
              schema:
                type: object
                required: [device_id, device_token, settings, home_url, away_url]
                properties:
                  device_id: { type: integer }
                  device_token: { type: string, pattern: '^mwd_[A-Za-z0-9_-]{43}$' }
                  settings: { $ref: '#/components/schemas/Settings' }
                  home_url: { type: [string, 'null'] }
                  away_url: { type: [string, 'null'] }
        '202':
          description: Still waiting for the driver.
          content:
            application/json:
              schema: { type: object, required: [status], properties: { status: { const: pending } } }
        '410':
          description: link_expired. Expired, refused on the web, already used, or unknown.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429':
          description: slow_down (polled before interval passed; wait Retry-After) or rate_limited.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  /link-requests/approve:
    post:
      tags: [devices]
      operationId: approveLinkRequest
      summary: The driver types the code the phone shows. Spaces and dashes are ignored. 10 wrong codes per 15 minutes per driver.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_code]
              additionalProperties: false
              properties:
                user_code: { type: string, maxLength: 20 }
      responses:
        '200':
          description: Approved; the phone links at its next poll.
          content:
            application/json:
              schema:
                type: object
                required: [id, device_name]
                properties:
                  id: { type: integer }
                  device_name: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: invalid_link_code (no waiting phone has this code) or validation_failed.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /link-requests/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [devices]
      operationId: denyLinkRequest
      summary: Not my phone. The phone's next poll gets 410.
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Dropped (also when it was already gone). }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: All paired devices, including revoked ones.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Device' } }
  /devices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [devices]
      operationId: renameDevice
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties: { name: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: Revoke a device. Its next request returns 401 device_revoked.
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Revoked (idempotent). }
        '404': { $ref: '#/components/responses/NotFound' }

  /mcp/tokens:
    get:
      tags: [mcp]
      operationId: listMcpTokens
      summary: The assistant access tokens, newest first (plan 26). The token itself is never listed.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Tokens, revoked and expired ones included.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/McpToken' } }
    post:
      tags: [mcp]
      operationId: createMcpToken
      summary: Make an assistant access token. The token is in this response only; the server keeps its SHA-256 hash.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
                scope: { enum: [read, write], description: 'write includes read.' }
                expires_in_days: { enum: [30, 90, 365, null], description: 'Default 90; null never expires.' }
      responses:
        '201':
          description: Made. Show `token` once.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/McpToken' }
                  - type: object
                    required: [token]
                    properties: { token: { type: string, pattern: '^mwa_[A-Za-z0-9_-]{43}$' } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /mcp/audit:
    get:
      tags: [mcp]
      operationId: listMcpAudit
      summary: The last 50 changes made by assistants, newest first (plan 26 section 3.7). Arguments are kept on the server only.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Audit rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, at, tool, outcome, target, token_id, token_name]
                  properties:
                    id: { type: integer }
                    at: { $ref: '#/components/schemas/EpochMs' }
                    tool: { type: string, description: 'The MCP tool, e.g. add_expense.' }
                    outcome: { type: string, description: '`ok`, or `error: ` and the problem title.' }
                    target: { type: [string, 'null'], description: 'The record touched, e.g. `expense:42` or `shift:17`.' }
                    token_id: { type: integer }
                    token_name: { type: string }
  /mcp/connection:
    get:
      tags: [mcp]
      operationId: checkMcpConnection
      summary: Test connection (Settings › AI assistants). Compares the address the browser is on with what reached the server through every proxy, and names the causes in plain words.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: address, in: query, required: true, schema: { type: string }, description: 'The address the browser is on, for example https://milewage.lan.' }
      responses:
        '200':
          description: The check.
          content:
            application/json:
              schema:
                type: object
                required: [ok, address, mcp_url, seen, public_url, home_url, findings]
                properties:
                  ok: { type: boolean, description: 'Assistants are told the same address the browser is on.' }
                  address: { type: string, description: The browser's address (origin only). }
                  mcp_url: { type: string, description: 'What the sign-in documents and the 401 give assistants. MILEWAGE_PUBLIC_URL or MILEWAGE_HOME_URL when the request came for its host, else the request''s own address.' }
                  seen:
                    type: object
                    required: [protocol, host, via]
                    properties:
                      protocol: { type: string, description: 'http or https, as it reached the API.' }
                      host: { type: string }
                      via: { type: [string, 'null'], description: 'The first address in X-Forwarded-For. Caddy replaces the list with the sender''s address when it does not trust the sender.' }
                  public_url: { type: [string, 'null'] }
                  home_url: { type: [string, 'null'] }
                  findings:
                    type: array
                    items:
                      type: object
                      required: [code, message]
                      properties:
                        code: { enum: [wrong_address, host_changed, proxy_not_trusted, forwarded_proto_missing, own_certificate] }
                        message: { type: string }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /mcp/tokens/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [mcp]
      operationId: revokeMcpToken
      summary: Revoke a token at once (idempotent).
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Revoked. }
        '404': { $ref: '#/components/responses/NotFound' }

  /mcp/tokens/{id}/replace:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [mcp]
      operationId: replaceMcpToken
      summary: A new secret for a live token made by hand; the old one stops working at once. Name, access, expiry and change history stay. The token is in this response only.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Replaced. Show `token` once.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/McpToken' }
                  - type: object
                    required: [token]
                    properties: { token: { type: string, pattern: '^mwa_[A-Za-z0-9_-]{43}$' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # Connecting an assistant by signing in (OAuth 2.1 with PKCE). The client's own endpoints follow
  # their RFCs, not this API's problem model, and are not listed here: `POST /oauth/register`
  # (RFC 7591), `POST /oauth/token` (RFC 6749, form body), and at the origin
  # `/.well-known/oauth-authorization-server` (RFC 8414) and
  # `/.well-known/oauth-protected-resource/api/v1/mcp` (RFC 9728). The two below serve the web page
  # `/oauth/authorize` where the driver says yes or no.
  /oauth/authorize:
    get:
      tags: [mcp]
      operationId: getOAuthAuthorization
      summary: Checks an assistant's sign-in request and says who is asking. 422 when the client, its return address or PKCE is wrong; nothing is sent to the assistant then.
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: response_type, in: query, required: true, schema: { const: code } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { const: S256 } }
        - { name: state, in: query, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string }, description: 'Space-separated; `write` asks for read and change.' }
        - { name: resource, in: query, schema: { type: string }, description: "RFC 8707; must be this server's MCP address." }
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The request is good; ask the driver.
          content:
            application/json:
              schema:
                type: object
                required: [client_name, redirect_uri, scope]
                properties:
                  client_name: { type: string, description: 'As the assistant registered itself.' }
                  redirect_uri: { type: string }
                  scope: { enum: [read, write], description: 'What the assistant asked for.' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [mcp]
      operationId: decideOAuthAuthorization
      summary: The driver's answer. Allow makes a one-minute code; either way the answer is the address to send the browser back to the assistant.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, redirect_uri, response_type, code_challenge, code_challenge_method, decision]
              properties:
                client_id: { type: string }
                redirect_uri: { type: string }
                response_type: { const: code }
                code_challenge: { type: string }
                code_challenge_method: { const: S256 }
                state: { type: string }
                scope: { type: string }
                resource: { type: string }
                decision: { enum: [allow, deny] }
                access: { enum: [read, write], description: 'What the driver allows; default read.' }
      responses:
        '200':
          description: Where to send the browser.
          content:
            application/json:
              schema:
                type: object
                required: [redirect_to]
                properties:
                  redirect_to: { type: string, description: 'The redirect URI with `code` or `error=access_denied`, `state` and `iss`.' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /settings:
