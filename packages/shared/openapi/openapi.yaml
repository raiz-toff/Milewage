      requestBody:
        required: true
        content:
          text/csv: { schema: { type: string } }
      responses:
        '200':
          description: Counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

