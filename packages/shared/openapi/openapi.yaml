    post:
      tags: [import]
      operationId: commitMileIqImport
      summary: 'Write the ok drives in one transaction: one finalized imported shift per drive with one manual trip (business or personal), and the parking and tolls of business drives as expenses linked to the shift. Idempotent - a repeat of the same file imports nothing.'
      security: [{ sessionCookie: [] }]
      requestBody:
