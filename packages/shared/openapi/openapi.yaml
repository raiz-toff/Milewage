  /exports/{format}:
    get:
      tags: [exports]
      operationId: exportData
      summary: 'Download a file from a registered exporter (csv, pdf, gpx, geojson, expenses, tax_summary). A disabled or unknown format returns 404. pdf is the mileage and expenses report for an accountant: from/to (at most 366 days) or year (the calendar year, as the tax summary), default this year.'
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: format, in: path, required: true, schema: { enum: [csv, pdf, gpx, geojson, expenses, tax_summary] }, description: 'Only formats whose exporter is registered and enabled exist. expenses, tax_summary and pdf are reports over a period, not a selection of shifts: from/to are optional for them, year selects the tax year, format=json is for tax_summary only.' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: shift_id, in: query, schema: { type: integer }, description: Alternative to from/to. }
        - { name: vehicle_id, in: query, schema: { type: integer } }
        - { name: level, in: query, description: "CSV only.", schema: { enum: [trip, shift], default: trip } }
        - { name: year, in: query, schema: { type: integer }, description: Tax year for tax_summary and the default year of expenses. }
        - { name: category, in: query, schema: { type: string }, description: expenses only. }
        - { name: format, in: query, schema: { enum: [csv, json], default: csv }, description: tax_summary only. }
        - { name: paper, in: query, schema: { enum: [a4, letter] }, description: 'pdf only. Default: US Letter where the country uses it (Unicode CLDR), A4 elsewhere.' }
      responses:
        '200':
          description: The file, streamed.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            text/csv: { schema: { type: string } }
            application/pdf: { schema: { type: string, contentMediaType: application/pdf } }
            application/gpx+xml: { schema: { type: string } }
            application/geo+json: { schema: { type: object } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

