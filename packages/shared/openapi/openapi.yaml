  /imports/{kind}/preview:
    parameters:
      - { name: kind, in: path, required: true, schema: { enum: [expenses, shifts] } }
      - { name: mapping, in: query, schema: { type: string }, description: JSON object of field to column name; omitted means the server's guess from the header. }
    post:
      tags: [import]
      operationId: previewImport
      summary: Read a CSV (text/csv, gzip allowed, 5 MB) and report the columns, the mapping and each row as ok, duplicate or error. Writes nothing.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          text/csv: { schema: { type: string } }
      responses:
        '200':
          description: The preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportPreview' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /imports/{kind}:
    parameters:
      - { name: kind, in: path, required: true, schema: { enum: [expenses, shifts] } }
      - { name: mapping, in: query, schema: { type: string } }
    post:
      tags: [import]
      operationId: commitImport
      summary: Write the ok rows in one transaction. Idempotent - a repeat of the same file imports zero rows. Imported shifts are finalized, whole-shift, with one manual trip of the typed distance, flagged imported, and marked as imported in every export.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          text/csv: { schema: { type: string } }
      responses:
        '200':
          description: Counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: Newest first. The time-based triggers (tax deadlines within 10 days, recurring expenses due, goals met, backup overdue) are evaluated when the list is read; the web is the only place it is looked at.
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
