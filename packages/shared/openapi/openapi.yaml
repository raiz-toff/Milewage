        '404': { $ref: '#/components/responses/NotFound' }
  /schedule/templates:
    post:
      tags: [schedule]
      operationId: createScheduleTemplate
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleTemplateInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleTemplate' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /schedule/templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [schedule]
      operationId: updateScheduleTemplate
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleTemplateInput' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleTemplate' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
