      summary: Download the encrypted backup file. Also resets the 30-day off-site reminder.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The .db.gz.age file.
          content:
            application/octet-stream: { schema: { type: string, contentMediaType: application/octet-stream } }
        '404': { $ref: '#/components/responses/NotFound' }
  /backups/offsite-ack:
    put:
      tags: [backups]
      operationId: setOffsiteAck
      summary: "Set the 'my backup folder is synced elsewhere' flag (re-asked every 90 days)."
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [synced_elsewhere]
              additionalProperties: false
              properties:
                synced_elsewhere: { type: boolean }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OffsiteState' }

  /system/status:
    get:
      tags: [system]
      operationId: getSystemStatus
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Operational status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }
  /diagnostics/events:
    post:
      tags: [diagnostics]
      operationId: ingestDiagnosticEvents
      summary: Upload diagnostics events (16). A device sends phone sources; a web session sends web errors only. Idempotent on (device, src, seq). Every event is validated against the allowlist schema; rejects are listed and never fail the batch.
      security: [{ sessionCookie: [] }, { deviceBearer: [] }]
      parameters:
        - { name: Content-Encoding, in: header, schema: { enum: [gzip, identity] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagIngestRequest' }
      responses:
        '200':
          description: Accepted events are stored; duplicates, discarded and rejected events are counted. Verbose events are accepted and discarded while disk is low.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagIngestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
    get:
      tags: [diagnostics]
      operationId: listDiagnosticEvents
      summary: Filtered, cursor-paginated diagnostics events. Web only.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: from_at, in: query, schema: { $ref: '#/components/schemas/EpochMs' } }
        - { name: to_at, in: query, schema: { $ref: '#/components/schemas/EpochMs' } }
        - { name: kind, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: src, in: query, schema: { enum: [phone_native, phone_js, server, web] } }
        - { name: device_id, in: query, schema: { type: integer } }
        - { name: shift, in: query, description: Shift client_id., schema: { type: string, format: uuid } }
        - { name: level, in: query, schema: { enum: [basic, verbose] } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: A page of events, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagEventPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /diagnostics/health:
    get:
      tags: [diagnostics]
      operationId: getDiagnosticsHealth
      summary: Tracking-health checks and score per paired device (last 7 shifts) and the server checks (16 section 10.1). Computed on read.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Health result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagnosticsHealth' }
        '404': { $ref: '#/components/responses/NotFound' }
  /diagnostics/bundle:
    get:
      tags: [diagnostics]
      operationId: downloadDebugBundle
      summary: Redacted debug bundle (16 section 10.2) - versions, health, per-shift summaries and re-validated events with relative times and pseudonymous ids. Capture data only when include_capture is given, and then anonymized.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: shift, in: query, description: Shift client_id., schema: { type: string, format: uuid } }
        - { name: include_capture, in: query, description: Capture session id to include (anonymized)., schema: { type: integer } }
      responses:
        '200':
          description: The gzipped JSON bundle.
          content:
            application/gzip: { schema: { type: string, contentMediaType: application/gzip } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /diagnostics/capture-sessions:
    post:
      tags: [diagnostics]
      operationId: createCaptureSession
      summary: Start a time-boxed capture session for one device (16 section 8). Web only; refused when disk is low or the capture cap is reached.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureSessionCreate' }
      responses:
        '201':
          description: Session created; the device learns it from GET /settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureSession' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
    get:
      tags: [diagnostics]
      operationId: listCaptureSessions
      summary: List capture sessions with their sizes and states.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Sessions, newest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CaptureSession' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /diagnostics/capture-sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [diagnostics]
      operationId: updateCaptureSession
      summary: End a session now. The recorded data is kept until it is deleted or purged.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureSessionPatch' }
      responses:
        '200':
          description: Session ended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureSession' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [diagnostics]
      operationId: deleteCaptureSession
      summary: Delete a session with its fixes and annotations.
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
  /diagnostics/capture-sessions/{id}/replay:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [diagnostics]
      operationId: downloadCaptureReplay
      summary: NDJSON replay for the test harness (16 section 8.4). anonymized (default) converts to metres from the first fix at latitude 0, longitude 0 with relative times; exact returns real coordinates for the owner's own harness.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: mode, in: query, schema: { enum: [anonymized, exact], default: anonymized } }
      responses:
        '200':
          description: One JSON object per line - meta, fix, annotation and shift lines.
          content:
            application/x-ndjson: { schema: { type: string } }
        '404': { $ref: '#/components/responses/NotFound' }
  /diagnostics/capture-sessions/{id}/fixes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [diagnostics]
      operationId: uploadCaptureFixes
      summary: Upload dense capture fixes for the device's own active session. Idempotent on (capture, seq).
      security: [{ deviceBearer: [] }]
      parameters:
        - { name: Content-Encoding, in: header, schema: { enum: [gzip, identity] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureFixBatch' }
      responses:
        '200':
          description: Every fix is stored or was already stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureFixResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
  /diagnostics/capture-sessions/{id}/annotations/{client_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: client_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [diagnostics]
      operationId: putCaptureAnnotation
      summary: Web only. Mark a detected stop real, false or missed, or add a note, for tuning (E9 to E12). Idempotent.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureAnnotationPut' }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureAnnotation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [diagnostics]
      operationId: deleteCaptureAnnotation
      summary: Delete an annotation.
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: mw_session }
    deviceBearer: { type: http, scheme: bearer, bearerFormat: "mwd_ opaque token" }

  parameters:
    Ref:
      name: ref
      in: path
      required: true
      description: Integer id or UUID client_id.
      schema: { type: string, pattern: '^([0-9]+|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$' }
    From:
      name: from
      in: query
      description: Local date YYYY-MM-DD in the instance timezone, inclusive.
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      schema: { type: string, format: date }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    BadRequest: { description: Malformed request., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unauthorized: { description: Missing, invalid or revoked credential., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Forbidden: { description: Scope, origin or setup state forbids this., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: No such row for this user., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: State conflict (see code)., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    TooLarge: { description: Body too large., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unprocessable: { description: Validation failed., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unavailable: { description: Read-only mode or restoring; retryable., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    InsufficientStorage: { description: Free disk below 200 MB; retryable., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  schemas:
    EpochMs: { type: integer, minimum: 0, description: UTC milliseconds since the Unix epoch. }
    Problem:
      type: object
      required: [type, title, status, code, retryable]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        retryable: { type: boolean }
        request_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string, description: JSON Pointer into the request body. }
              message: { type: string }

    Country:
      type: object
      required: [code, name, currency, unit, labels, supports, verified, regional_rules, regions]
      properties:
        code: { type: string, description: ISO 3166-1 alpha-2. }
        name: { type: string, description: 'From Unicode CLDR (Intl.DisplayNames), in English.' }
        currency: { type: string, description: ISO 4217. }
        unit: { enum: [km, mi] }
        labels:
          type: object
          required: [region, city]
          description: What the country calls its levels, in libaddressinput's words (province, state, nation ...); null when it has none.
          properties:
            region: { type: [string, 'null'] }
            city: { type: [string, 'null'] }
        supports:
          type: object
          required: [mileage, tax]
          properties:
            mileage: { type: boolean, description: The country has published mileage rates. }
            tax: { type: boolean, description: 'The country has a tax estimate and comma.tax_countries does not hide it.' }
        verified: { type: boolean, description: False until a person has checked the figures against the primary sources. }
        regional_rules: { type: boolean, description: 'Some region or city has its own rules, so setting the region can change results.' }
        regions: { type: array, items: { $ref: '#/components/schemas/CountryPlace' } }
    CountryPlace:
      type: object
      required: [code, name, own_rules, verified, cities]
      properties:
        code: { type: string, description: 'A region: the ISO 3166-2 part after the country, as settings.region stores it (ON). A city: its full code (US-NY-NYC).' }
        name: { type: string }
        own_rules: { type: boolean, description: This place has data that differs from the level above. }
        verified: { type: boolean, description: True only if every level that supplies data was checked by a person. }
        cities: { type: array, items: { $ref: '#/components/schemas/CountryPlace' } }
    SetupRequest:
      type: object
      required: [username, password, country, distance_unit, currency, timezone]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 10 }
        country: { type: string, minLength: 2, maxLength: 2 }
        distance_unit: { enum: [km, mi] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        timezone: { type: string, description: IANA name }
    Modules:
      type: object
      description: Read-only module flags so clients can hide screens and buttons of absent modules.
      required: [progress, schedule, notifications, import, maintenance, analytics, goals, tax, receipts, expenses, earnings, platforms, devices, tracking, replay, stops, sync, diagnostics, capture, backup_download, exporters, countries]
      properties:
        platforms: { type: boolean, description: 'Platforms module registered (18 section 4.2).' }
        earnings: { type: boolean, description: 'Earnings module registered (18 section 4.3): the driver can type a total per shift and platform.' }
        expenses: { type: boolean, description: 'Expenses module registered (18 section 5).' }
        receipts: { type: boolean, description: 'Receipts module registered (18 section 5.4); needs expenses.' }
        tax: { type: boolean, description: 'Tax module registered (18 section 7). The estimate itself exists only for countries whose pack is verified or switched on.' }
        goals: { type: boolean, description: 'Goals module registered (18 section 8.1).' }
        analytics: { type: boolean, description: 'Analytics module registered (18 section 10.1).' }
        maintenance: { type: boolean, description: 'Maintenance module registered (18 section 6).' }
        import: { type: boolean, description: 'Import module registered (18 section 12). The expenses kind also needs the expenses module.' }
        notifications: { type: boolean, description: 'Notifications module registered (18 section 11): the in-app inbox.' }
        schedule: { type: boolean, description: 'Schedule module registered (18 section 9); off by default.' }
        progress: { type: boolean, description: 'Progress module registered (18 section 8.2); off by default.' }
        sync: { type: boolean }
        local_export: { type: boolean, description: Reserved for v1.1; false in v1. }
        devices: { type: boolean }
        tracking: { type: boolean }
        replay: { type: boolean }
        stops: { type: boolean, description: 'Effective flag: the stops module is registered AND settings.stops_enabled is true. When false the phone and the web hide every stop and estimated-split element.' }
        diagnostics: { type: boolean, description: 'Diagnostics module registered (16). When false the phone behaves as level off and the web hides the Diagnostics screens.' }
        capture: { type: boolean, description: 'Capture module registered (16 section 8); false by default.' }
        backup_download: { type: boolean }
        exporters: { type: array, items: { enum: [csv, pdf, gpx, geojson, expenses, tax_summary] } }
        countries: { type: array, items: { type: string, minLength: 2, maxLength: 2 } }
    Settings:
      type: object
      required: [country, distance_unit, currency, timezone, raw_retention_days, stops_enabled, display_name, region, logbook, own_mileage_rate, mileage_rate, week_start, time_format, default_vehicle_id, engine_version, diagnostics, modules]
      properties:
        modules: { $ref: '#/components/schemas/Modules' }
        engine_version: { type: integer, description: The server's track-engine algorithmVersion (14 section 11). A phone with a lower number still shows its own result until sync. }
        country: { type: string }
        distance_unit: { enum: [km, mi] }
        currency: { type: string }
        timezone: { type: string }
        raw_retention_days: { type: integer, minimum: 7 }
        stops_enabled: { type: boolean, description: 'Driver-facing toggle for auto-detected stops, the estimated active/deadhead split and web labelling (decision 1.5b). Default true. Captured per shift at shift start (Shift.segmenter), so changing it never alters an existing shift.' }
        display_name: { type: [string, 'null'], description: Greeting and export header. }
        region: { type: [string, 'null'], description: 'Subdivision code without the country (CA: ON, QC ...); validated by the country pack.' }
        logbook:
          type: [object, 'null']
          description: What the tax office of the driver's country and region asks of odometer records (plan 21 logbook slot), for the Odometer screen. null when the country has no such rule; readings are then optional.
          required: [readings, notes]
          properties:
            readings: { type: string }
            notes: { type: array, items: { type: string } }
        own_mileage_rate:
          oneOf: [{ $ref: '#/components/schemas/OwnMileageRate' }, { type: 'null' }]
          description: The driver's own rate (plan 21 Q5). Used only where the country has no official rates; it never replaces one.
        mileage_rate: { enum: [official, yours, none], description: 'Which rate values mileage: the country''s published rates, the driver''s own (screens and exports label it "your rate", never official), or none.' }
        week_start: { enum: [0, 1], description: 0 Sunday, 1 Monday. Changes week boundaries, so the phone reads it. }
        time_format: { enum: [12h, 24h] }
        default_vehicle_id: { type: [integer, 'null'], description: Preselected when a shift starts; always an active vehicle. }
        diagnostics: { $ref: '#/components/schemas/DiagnosticsSettings' }
    SettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        country: { type: string, minLength: 2, maxLength: 2 }
        distance_unit: { enum: [km, mi] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        timezone: { type: string }
        raw_retention_days: { type: integer, minimum: 7 }
        stops_enabled: { type: boolean }
        diagnostics_level: { enum: [off, basic, verbose], description: 'verbose reverts to basic after 7 days (16 section 5).' }
        display_name: { type: [string, 'null'], maxLength: 64 }
        region: { type: [string, 'null'], minLength: 2, maxLength: 3, description: A new country clears a region it does not have. }
        week_start: { enum: [0, 1] }
        time_format: { enum: [12h, 24h] }
        default_vehicle_id: { type: [integer, 'null'], minimum: 1 }
        own_mileage_rate:
          oneOf: [{ $ref: '#/components/schemas/OwnMileageRate' }, { type: 'null' }]
          description: Stored even where the country has official rates, but used only where it has none.
    OwnMileageRate:
      type: object
      additionalProperties: false
      required: [cents_per_unit, unit]
      properties:
        cents_per_unit: { type: number, exclusiveMinimum: 0, maximum: 100000, description: 'Minor units of the currency per km or mile; hundredths are kept (30.5).' }
        unit: { enum: [km, mi] }
    Device:
      type: object
      required: [id, name, platform, created_at, last_seen_at, revoked_at]
      properties:
        id: { type: integer }
        name: { type: string }
        platform: { enum: [android, ios] }
        created_at: { $ref: '#/components/schemas/EpochMs' }
        last_seen_at: { type: [integer, 'null'] }
        revoked_at: { type: [integer, 'null'] }
        online: { type: boolean }
        clock_skew_ms: { type: [integer, 'null'], description: Last observed phone-minus-server clock difference; in memory only. }

    VehicleKind: { enum: [car, motorcycle, van, bicycle, ebike, scooter, walking], description: 'bicycle, ebike, scooter and walking are not automobiles: no mileage allowance rate applies (18 section 4.1).' }
    VehiclePower: { enum: [gas, hybrid, ev, other] }
    VehicleCreate:
      type: object
      required: [name, kind]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 64 }
        kind: { $ref: '#/components/schemas/VehicleKind' }
        make: { type: [string, 'null'], maxLength: 64 }
        model: { type: [string, 'null'], maxLength: 64 }
        year: { type: [integer, 'null'], minimum: 1900, maximum: 2100 }
        plate: { type: [string, 'null'], maxLength: 16, description: The driver's own record; never exported unless the driver ticks it. }
        power: { oneOf: [{ $ref: '#/components/schemas/VehiclePower' }, { type: 'null' }] }
    Vehicle:
      type: object
      required: [id, name, kind, make, model, year, plate, power, created_at, archived_at]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { $ref: '#/components/schemas/VehicleKind' }
        make: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        year: { type: [integer, 'null'] }
        plate: { type: [string, 'null'] }
        power: { oneOf: [{ $ref: '#/components/schemas/VehiclePower' }, { type: 'null' }] }
        created_at: { $ref: '#/components/schemas/EpochMs' }
        archived_at: { type: [integer, 'null'] }

    OdometerKind: { enum: [shift_start, shift_end, year_start, year_end] }
    OdometerReading:
      type: object
      required: [id, vehicle_id, shift_id, kind, reading_m, recorded_at]
      properties:
        id: { type: integer }
        vehicle_id: { type: integer }
        shift_id: { type: [integer, 'null'] }
        kind: { $ref: '#/components/schemas/OdometerKind' }
        reading_m: { type: integer, minimum: 0 }
        recorded_at: { $ref: '#/components/schemas/EpochMs' }

    Platform:
      type: object
      required: [slug, label, custom, color, emoji, active, sort, hourly_target_cents]
      properties:
        slug: { type: string }
        label: { type: string }
        custom: { type: boolean }
        color: { type: [string, 'null'] }
        emoji: { type: [string, 'null'] }
        active: { type: boolean }
        sort: { type: integer }
        hourly_target_cents: { type: [integer, 'null'], description: Used by analytics only. }
    PlatformPut:
      type: object
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 40 }
        color: { type: [string, 'null'], pattern: '^#[0-9a-f]{6}$' }
        emoji: { type: [string, 'null'], maxLength: 8 }
        active: { type: boolean }
        sort: { type: integer, minimum: 0 }
        hourly_target_cents: { type: [integer, 'null'], minimum: 0 }

    ShiftEarningsPut:
      type: object
      additionalProperties: false
      description: Omitted amounts are 0 and omitted counts are null, because the row is replaced.
      properties:
        gross_cents: { type: integer, minimum: 0 }
        tips_cents: { type: integer, minimum: 0 }
        bonus_cents: { type: integer, minimum: 0 }
        orders: { type: [integer, 'null'], minimum: 0, description: The platform's own count for the shift, typed once. }
        online_min: { type: [integer, 'null'], minimum: 0 }
        notes: { type: [string, 'null'], maxLength: 2000 }
    ShiftEarnings:
      type: object
      required: [entries, labels, effective]
      properties:
        entries:
          type: array
          items:
            type: object
            required: [platform, gross_cents, tips_cents, bonus_cents, orders, online_min, notes, source, edited_at]
            properties:
              platform: { type: string }
              gross_cents: { type: integer }
              tips_cents: { type: integer }
              bonus_cents: { type: integer }
              orders: { type: [integer, 'null'] }
              online_min: { type: [integer, 'null'] }
              notes: { type: [string, 'null'] }
              source: { enum: [manual, import] }
              edited_at: { $ref: '#/components/schemas/EpochMs' }
        labels:
          type: array
          items:
            type: object
            required: [platform, payout_cents, tip_cents, dropoffs]
            properties:
              platform: { type: string }
              payout_cents: { type: integer }
              tip_cents: { type: integer }
              dropoffs: { type: integer }
        effective:
          type: array
          items:
            type: object
            required: [platform, gross_cents, tips_cents, bonus_cents, total_cents, orders, source]
            properties:
              platform: { type: string }
              gross_cents: { type: integer }
              tips_cents: { type: integer }
              bonus_cents: { type: integer }
              total_cents: { type: integer }
              orders: { type: [integer, 'null'] }
              source: { enum: [labels, entered, mixed] }

    ExpenseCreate:
      type: object
      required: [spent_on, category, amount_cents]
      additionalProperties: false
      properties:
        spent_on: { type: string, format: date, description: The driver's local date. }
        category: { type: string, description: A slug from GET /expenses/categories. }
        amount_cents: { type: integer, minimum: 1, description: Total paid, tax included. }
        merchant: { type: string, maxLength: 120 }
        deductible: { type: boolean, description: Defaults from the category. }
        business_pct: { type: integer, minimum: 0, maximum: 100, description: Defaults from the category. }
        tax_credit_cents: { type: integer, minimum: 0, description: Input tax credit portion (HST/GST/VAT); not more than the amount. }
        vehicle_id: { type: [integer, 'null'] }
        shift_id: { type: [integer, 'null'] }
        notes: { type: [string, 'null'], maxLength: 2000 }
        recurrence: { enum: [weekly, monthly, yearly, null], description: 'Makes the row a reminder template, not an expense. Needs next_due.' }
        next_due: { type: [string, 'null'], format: date }
    ExpensePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        spent_on: { type: string, format: date, description: The driver's local date. }
        category: { type: string, description: A slug from GET /expenses/categories. }
        amount_cents: { type: integer, minimum: 1, description: Total paid, tax included. }
        merchant: { type: string, maxLength: 120 }
        deductible: { type: boolean, description: Defaults from the category. }
        business_pct: { type: integer, minimum: 0, maximum: 100, description: Defaults from the category. }
        tax_credit_cents: { type: integer, minimum: 0, description: Input tax credit portion (HST/GST/VAT); not more than the amount. }
        vehicle_id: { type: [integer, 'null'] }
        shift_id: { type: [integer, 'null'] }
        notes: { type: [string, 'null'], maxLength: 2000 }
        recurrence: { enum: [weekly, monthly, yearly, null], description: 'Makes the row a reminder template, not an expense. Needs next_due.' }
        next_due: { type: [string, 'null'], format: date }
    Expense:
      type: object
      required: [id, spent_on, category, amount_cents, merchant, deductible, business_pct, tax_credit_cents, vehicle_id, shift_id, notes, recurrence, next_due, snoozed_until, template_id, deductible_cents, double_counts, has_receipt, created_at, updated_at]
      properties:
        id: { type: integer }
        spent_on: { type: string, format: date }
        category: { type: string }
        amount_cents: { type: integer }
        merchant: { type: string }
        deductible: { type: boolean }
        business_pct: { type: integer }
        tax_credit_cents: { type: integer }
        vehicle_id: { type: [integer, 'null'] }
        shift_id: { type: [integer, 'null'] }
        notes: { type: [string, 'null'] }
        recurrence: { enum: [weekly, monthly, yearly, null] }
        next_due: { type: [string, 'null'] }
        snoozed_until: { type: [string, 'null'] }
        template_id: { type: [integer, 'null'] }
        deductible_cents: { type: integer, description: 'Computed at read time: amount x business % rounded half up, 0 when not deductible.' }
        double_counts: { type: boolean, description: A standard-mileage vehicle's rate already covers this category; saved and warned about, not deducted. }
        has_receipt: { type: boolean }
        created_at: { $ref: '#/components/schemas/EpochMs' }
        updated_at: { $ref: '#/components/schemas/EpochMs' }
    ExpensePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Expense' } }
        next_cursor: { type: [string, 'null'] }
    ExpenseCategory:
      type: object
      required: [slug, label, default_deductible, default_business_pct, vehicle_related, covered_by_standard_rate]
      properties:
        slug: { type: string }
        label: { type: string }
        default_deductible: { type: boolean }
        default_business_pct: { type: integer }
        vehicle_related: { type: boolean }
        covered_by_standard_rate: { type: boolean }
    ExpenseTotals:
      type: object
      required: [year, total_cents, deductible_cents, double_counts_cents, by_category]
      properties:
        year: { type: integer }
        total_cents: { type: integer }
        deductible_cents: { type: integer, description: Without the double-counting ones. }
        double_counts_cents: { type: integer }
        by_category:
          type: array
          items:
            type: object
            required: [category, count, total_cents, deductible_cents, double_counts_cents]
            properties:
              category: { type: string }
              count: { type: integer }
              total_cents: { type: integer }
              deductible_cents: { type: integer }
              double_counts_cents: { type: integer }

    Receipt:
      type: object
      required: [expense_id, mime, bytes, sha256, created_at]
      properties:
        expense_id: { type: integer }
        mime: { enum: [image/jpeg, image/png, image/webp, application/pdf] }
        bytes: { type: integer }
        sha256: { type: string }
        created_at: { $ref: '#/components/schemas/EpochMs' }

    VehicleTaxYear:
      type: object
      required: [vehicle_id, tax_year, method, source, rate1_milli, rate2_milli, threshold_m]
      properties:
        vehicle_id: { type: integer }
        tax_year: { type: integer }
        method: { enum: [standard_mileage, actual_expenses] }
        source: { enum: [saved, default] }
        rate1_milli: { type: [integer, 'null'] }
        rate2_milli: { type: [integer, 'null'] }
        threshold_m: { type: [integer, 'null'] }
    TaxJar:
      type: object
      required: [year, balance_cents, target_cents, entries]
      properties:
        year: { type: integer }
        balance_cents: { type: integer }
        target_cents: { type: [integer, 'null'], description: Gross earnings times the set-aside rate; null without earnings. }
        entries:
          type: array
          items:
            type: object
            required: [id, amount_cents, entered_on, note]
            properties:
              id: { type: integer }
              amount_cents: { type: integer }
              entered_on: { type: string, format: date }
              note: { type: [string, 'null'] }
    TaxYear:
      type: object
      required: [year, country, region, supported, unverified, set_aside_bp, sales_tax_registered, sales_tax_name, notices, income, deductions, estimate, deadlines, slip_alerts, jar]
      properties:
        year: { type: integer }
        country: { type: string }
        region: { type: [string, 'null'] }
        supported: { type: boolean, description: False when the country has no switched-on pack; then income, deductions and estimate are null. }
        unverified: { type: boolean, description: True while the pack's figures have not been compared with the primary publications; the screen shows an "unverified rates" notice. }
        set_aside_bp: { type: integer }
        sales_tax_registered: { type: boolean }
        sales_tax_name: { type: [string, 'null'], description: 'The sales tax of the driver''s place from the country data (GST, HST), for the "Registered for ..." choice; null when none is known.' }
        notices: { type: array, items: { type: string } }
        income:
          type: [object, 'null']
          description: Effective earnings of the year; null when none were entered or labelled.
          properties:
            gross_cents: { type: integer }
            tips_cents: { type: integer }
            bonus_cents: { type: integer }
            total_cents: { type: integer }
            by_platform: { type: array, items: { type: object, properties: { platform: { type: string }, total_cents: { type: integer } } } }
        deductions:
          type: [object, 'null']
          properties:
            expenses_cents: { type: [integer, 'null'], description: null when the expenses module is off. }
            double_counted_cents: { type: [integer, 'null'] }
            mileage_cents: { type: [integer, 'null'], description: A deduction, never cash. }
            vehicles: { type: array, items: { type: object, properties: { vehicle_id: { type: integer }, method: { enum: [standard_mileage, actual_expenses] } } } }
        estimate:
          type: [object, 'null']
          required: [net_income_cents, taxable_income_cents, lines, total_set_aside_cents, instalment_cents, sales_tax]
          properties:
            net_income_cents: { type: integer }
            taxable_income_cents: { type: integer }
            lines:
              type: array
              description: The amounts to set aside, as the country's tax pack computes them (CA, pension contribution, second band, income tax at the set-aside rate). They add up to total_set_aside_cents.
              items:
                type: object
                required: [key, label, cents, note]
                properties:
                  key: { type: string, description: Stable name, also the export row name. }
                  label: { type: string }
                  cents: { type: [integer, 'null'], description: null when not estimated here; note says why. }
                  note: { type: [string, 'null'] }
            total_set_aside_cents: { type: integer }
            instalment_cents: { type: integer }
            sales_tax:
              type: [object, 'null']
              properties:
                collected_cents: { type: integer }
                credits_cents: { type: integer }
                owing_cents: { type: integer }
                rate_bp: { type: integer }
        deadlines: { type: array, items: { type: object, properties: { date: { type: string, format: date }, kind: { enum: [instalment, balance, filing] }, label: { type: string } } } }
        slip_alerts: { type: array, items: { type: object, properties: { platform: { type: string }, total_cents: { type: integer }, threshold_cents: { type: integer }, slip: { type: string } } } }
        jar:
          type: object
          properties:
            balance_cents: { type: integer }
            target_cents: { type: [integer, 'null'] }

    GoalCreate:
      type: object
      required: [label, metric, period, target]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        metric: { enum: [earnings, hours, shifts, active_distance] }
        period: { enum: [daily, weekly, monthly, yearly] }
        target: { type: integer, minimum: 1, description: 'Cents, minutes, a count or metres, by metric.' }
        active: { type: boolean }
    GoalPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        metric: { enum: [earnings, hours, shifts, active_distance] }
        period: { enum: [daily, weekly, monthly, yearly] }
        target: { type: integer, minimum: 1 }
        active: { type: boolean }
    Goal:
      type: object
      required: [id, label, metric, period, target, active, created_at, progress]
      properties:
        id: { type: integer }
        label: { type: string }
        metric: { enum: [earnings, hours, shifts, active_distance] }
        period: { enum: [daily, weekly, monthly, yearly] }
        target: { type: integer }
        active: { type: boolean }
        created_at: { $ref: '#/components/schemas/EpochMs' }
        progress:
          type: object
          required: [value, target, ratio, period_from, period_to, estimated, note]
          properties:
            value: { type: [integer, 'null'], description: 'null when it cannot be known (no earnings entered, no stop-based split), never 0.' }
            target: { type: integer }
            ratio: { type: [number, 'null'] }
            period_from: { type: string, format: date }
            period_to: { type: string, format: date }
            estimated: { type: boolean, description: 'True for active distance, the stop-based estimate of 14 section 6.' }
            note: { type: [string, 'null'] }

    MaintenanceCreate:
      type: object
      required: [kind, serviced_on]
      additionalProperties: false
      properties:
        kind: { enum: [oil_change, tires, brakes, other] }
        serviced_on: { type: string, format: date }
        odometer_m: { type: [integer, 'null'], minimum: 0 }
        cost_cents: { type: [integer, 'null'], minimum: 0 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        record_expense: { type: boolean }
    MaintenancePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        kind: { enum: [oil_change, tires, brakes, other] }
        serviced_on: { type: string, format: date }
        odometer_m: { type: [integer, 'null'], minimum: 0 }
        cost_cents: { type: [integer, 'null'], minimum: 0 }
        notes: { type: [string, 'null'], maxLength: 2000 }
    MaintenanceLog:
      type: object
      required: [id, vehicle_id, kind, serviced_on, odometer_m, cost_cents, expense_id, double_counts, notes, created_at]
      properties:
        id: { type: integer }
        vehicle_id: { type: integer }
        kind: { enum: [oil_change, tires, brakes, other] }
        serviced_on: { type: string, format: date }
        odometer_m: { type: [integer, 'null'] }
        cost_cents: { type: [integer, 'null'] }
        expense_id: { type: [integer, 'null'] }
        double_counts: { type: boolean, description: The linked expense is covered by the vehicle's standard mileage rate. }
        notes: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/EpochMs' }

    ImportPreview:
      type: object
      required: [kind, columns, fields, mapping, row_count, summary, rows]
      properties:
        kind: { enum: [expenses, shifts] }
        columns: { type: array, items: { type: string } }
        fields: { type: array, items: { type: string } }
        mapping: { type: object, additionalProperties: { type: [string, 'null'] } }
        row_count: { type: integer }
        summary: { type: object, properties: { ok: { type: integer }, duplicate: { type: integer }, error: { type: integer } } }
        rows:
          type: array
          description: The first 200 rows.
          items:
            type: object
            properties:
              row: { type: integer }
              status: { enum: [ok, duplicate, error] }
              message: { type: [string, 'null'] }
    ImportResult:
      type: object
      required: [kind, imported, duplicates, errors, error_rows]
      properties:
        kind: { enum: [expenses, shifts] }
        imported: { type: integer }
        duplicates: { type: integer }
        errors: { type: integer }
        error_rows: { type: array, items: { type: object, properties: { row: { type: integer }, message: { type: [string, 'null'] } } } }

    Notification:
      type: object
      required: [id, kind, body_key, ref, created_at, read_at]
      properties:
        id: { type: integer }
        kind: { enum: [badge, challenge, level_up, streak_freeze, streak_risk, goal_met, tax_deadline, shift_reminder, backup_overdue, backup_failed, recurring_expense_due] }
        body_key: { type: string, description: 'Message id; the client builds the text. No free text and no amounts.' }
        ref: { type: string, description: What it is about (a date or an id), from the dedupe key. }
        created_at: { $ref: '#/components/schemas/EpochMs' }
        read_at: { type: [integer, 'null'] }
    NotificationPage:
      type: object
      required: [items, next_cursor, unread_count]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        next_cursor: { type: [string, 'null'] }
        unread_count: { type: integer }
    NotificationPrefs:
      type: object
      required: [shift_reminders, goals, tax_deadlines, streak, backup, sync_reminder]
      properties:
        shift_reminders: { type: boolean, description: Fired by the phone itself; the phone reads this. }
        goals: { type: boolean }
        tax_deadlines: { type: boolean }
        streak: { type: boolean }
        backup: { type: boolean }
        sync_reminder: { type: boolean, description: Fired by the phone itself; the phone reads this. }
    NotificationPrefsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        shift_reminders: { type: boolean }
        goals: { type: boolean }
        tax_deadlines: { type: boolean }
        streak: { type: boolean }
        backup: { type: boolean }
        sync_reminder: { type: boolean }

    ScheduleEntryInput:
      type: object
      additionalProperties: false
      description: planned_on, start_time and end_time are required on create.
      properties:
        planned_on: { type: string, format: date }
        start_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        end_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        platform: { type: [string, 'null'] }
        vehicle_id: { type: [integer, 'null'] }
        remind: { type: boolean }
    ScheduleEntry:
      type: object
      required: [id, planned_on, start_time, end_time, platform, vehicle_id, template_id, shift_id, remind]
      properties:
        id: { type: integer }
        planned_on: { type: string, format: date }
        start_time: { type: string }
        end_time: { type: string }
        platform: { type: [string, 'null'] }
        vehicle_id: { type: [integer, 'null'] }
        template_id: { type: [integer, 'null'] }
        shift_id: { type: [integer, 'null'], description: Set when the driver worked that day (matched by date). }
        remind: { type: boolean }
    ScheduleTemplateInput:
      type: object
      additionalProperties: false
      description: label, weekdays, start_time and end_time are required on create.
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        weekdays: { type: integer, minimum: 1, maximum: 127, description: 'Bit 0 Monday ... bit 6 Sunday.' }
        start_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        end_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        platform: { type: [string, 'null'] }
        vehicle_id: { type: [integer, 'null'] }
        active: { type: boolean }
    ScheduleTemplate:
      type: object
      required: [id, label, weekdays, start_time, end_time, platform, vehicle_id, active]
      properties:
        id: { type: integer }
        label: { type: string }
        weekdays: { type: integer }
        start_time: { type: string }
        end_time: { type: string }
        platform: { type: [string, 'null'] }
        vehicle_id: { type: [integer, 'null'] }
        active: { type: boolean }
    Schedule:
      type: object
      required: [entries, off_days, templates]
      properties:
        entries: { type: array, items: { $ref: '#/components/schemas/ScheduleEntry' } }
        off_days: { type: array, items: { type: object, properties: { off_on: { type: string }, note: { type: [string, 'null'] } } } }
        templates: { type: array, items: { $ref: '#/components/schemas/ScheduleTemplate' } }

    Progress:
      type: object
      required: [xp, level, xp_into_level, xp_per_level, streak, challenges, badges]
      properties:
        xp: { type: integer }
        level: { type: integer }
        xp_into_level: { type: integer }
        xp_per_level: { type: integer }
        streak:
          type: object
          required: [days, freezes_held, at_risk]
          properties:
            days: { type: integer }
            freezes_held: { type: integer, maximum: 3 }
            at_risk: { type: boolean }
        challenges:
          type: array
          description: The weekly challenges. The labelled drop-offs challenge is absent while nothing is labelled.
          items:
            type: object
            required: [id, label, value, target, done, week_start]
            properties:
              id: { enum: [earn, deliveries, streak5] }
              label: { type: string }
              value: { type: [integer, 'null'], description: null when unknown (nothing entered this week). }
              target: { type: integer }
              done: { type: boolean }
              week_start: { type: string, format: date }
        badges:
          type: array
          items:
            type: object
            required: [slug, label, unlocked_at]
            properties:
              slug: { type: string }
              label: { type: string }
              unlocked_at: { type: [integer, 'null'] }

    ShiftStatus: { enum: [active, ended, finalized] }
    ShiftStart:
      type: object
      required: [client_id, vehicle_id, started_at]
      additionalProperties: false
      properties:
        client_id: { type: string, format: uuid }
        vehicle_id: { type: integer }
        started_at: { $ref: '#/components/schemas/EpochMs' }
        segmenter: { $ref: '#/components/schemas/Segmenter', description: 'The phone sends the value it read from its cached settings (stops_enabled). Omitted (an older phone): the server uses the current setting at receipt.' }
        notes: { type: string, maxLength: 2000 }
    Segmenter: { enum: [stops, whole_shift] }
    Shift:
      type: object
      required: [id, client_id, vehicle_id, status, segmenter, started_at, ended_at, local_date, total_m, active_m, deadhead_m, personal_m, calc_version, calculated_at, notes, deduction_cents]
      properties:
        id: { type: integer }
        client_id: { type: string, format: uuid }
        vehicle_id: { type: integer }
        status: { $ref: '#/components/schemas/ShiftStatus' }
        started_at: { $ref: '#/components/schemas/EpochMs' }
        ended_at: { type: [integer, 'null'] }
        local_date: { type: string, format: date }
        segmenter: { $ref: '#/components/schemas/Segmenter', description: 'stops = active_m and deadhead_m are ESTIMATES from detected stops (clients label them so); whole_shift = one active segment. total_m is the same either way.' }
        total_m: { type: [integer, 'null'] }
        active_m: { type: [integer, 'null'], description: Estimated when segmenter is stops. }
        deadhead_m: { type: [integer, 'null'], description: Estimated when segmenter is stops. }
        personal_m: { type: [integer, 'null'] }
        calc_version: { type: [integer, 'null'] }
        calculated_at: { type: [integer, 'null'] }
        notes: { type: [string, 'null'] }
        deduction_cents: { type: [integer, 'null'], description: Computed at read time from the country registry; never stored. }
        updated_at: { $ref: '#/components/schemas/EpochMs' }
        recon_status: { enum: [pending, match, differs, phone_missing] }
        recon_reasons: { type: array, items: { type: string } }
        calc_mismatch: { type: boolean }
        flags: { type: array, items: { $ref: '#/components/schemas/ShiftFlag' } }
        overlaps_shift_id: { type: [integer, 'null'], description: Set when a late upload made this shift overlap another (15 section 9.2). }
    ShiftFlag:
      type: object
      required: [code, severity]
      properties:
        code: { type: string, description: 'One of the flags in 14 section 8.' }
        severity: { enum: [info, review] }
        detail: { type: [object, 'null'] }
    PointManifest:
      type: object
      required: [first_seq, last_seq, point_count]
      additionalProperties: false
      properties:
        first_seq: { type: integer, minimum: 1 }
        last_seq: { type: integer, minimum: 1 }
        point_count: { type: integer, minimum: 0 }
    PhoneResult:
      type: object
      required: [calc_version, segmenter, input_digest, total_m, active_m, deadhead_m, personal_m, trips_count]
      additionalProperties: false
      properties:
        calc_version: { type: integer }
        segmenter: { $ref: '#/components/schemas/Segmenter' }
        input_digest: { type: string, pattern: '^[0-9a-f]{16}$' }
        total_m: { type: integer, minimum: 0 }
        active_m: { type: integer, minimum: 0 }
        deadhead_m: { type: integer, minimum: 0 }
        personal_m: { type: integer, minimum: 0 }
        trips_count: { type: integer, minimum: 0 }
    Interruption:
      type: object
      required: [from_ms, to_ms]
      additionalProperties: false
      properties:
        from_ms: { $ref: '#/components/schemas/EpochMs' }
        to_ms: { $ref: '#/components/schemas/EpochMs' }
    Recon:
      type: object
      required: [status, reasons]
      properties:
        status: { enum: [match, differs, phone_missing] }
        server_total_m: { type: integer }
        diff_m: { type: integer, description: Server total minus phone total. }
        reasons: { type: array, items: { enum: [points_missing, calc_version, edited_on_web, late_points, engine_disagreement, unknown] } }
    EndShiftResult:
      allOf:
        - { $ref: '#/components/schemas/Shift' }
        - type: object
          properties:
            recon: { $ref: '#/components/schemas/Recon' }
    ManualTripPut:
      allOf:
        - { $ref: '#/components/schemas/TripCreate' }
        - type: object
          required: [edited_at]
          properties:
            edited_at: { $ref: '#/components/schemas/EpochMs' }
    TripOverridePut:
      type: object
      required: [kind, purpose, edited_at]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/TripKind' }
        purpose: { type: string, minLength: 1, maxLength: 200 }
        edited_at: { $ref: '#/components/schemas/EpochMs' }
    ChangeEntry:
      type: object
      required: [seq, entity, op, key]
      properties:
        seq: { type: integer }
        entity: { enum: [shift, trip, odometer, vehicle, settings, override] }
        op: { enum: [upsert, delete, orphaned_override] }
        key: { type: string }
        data: { type: [object, 'null'], description: The entity in its API shape; null for delete. }
    SyncChanges:
      type: object
      required: [changes, next_cursor, has_more]
      properties:
        changes: { type: array, items: { $ref: '#/components/schemas/ChangeEntry' } }
        next_cursor: { type: integer }
        has_more: { type: boolean }
    ShiftPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Shift' } }
        next_cursor: { type: [string, 'null'] }

    Route:
      type: object
      required: [source, t, lat_e7, lon_e7]
      description: Parallel arrays of equal length. speed_dmps is null-filled for archived routes.
      properties:
        source: { enum: [raw, archive] }
        t: { type: array, items: { type: integer }, description: recorded_at in epoch ms. }
        lat_e7: { type: array, items: { type: integer } }
        lon_e7: { type: array, items: { type: integer } }
        speed_dmps: { type: array, items: { type: [integer, 'null'] } }

    TripKind: { enum: [active, deadhead, personal] }
    Trip:
      type: object
      required: [id, shift_id, kind, original_kind, source, started_at, ended_at, distance_m, purpose, edited_at]
      properties:
        id: { type: integer }
        shift_id: { type: integer }
        trip_key: { type: string }
        kind: { $ref: '#/components/schemas/TripKind' }
        original_kind: { enum: [active, deadhead] }
        source: { enum: [auto, manual] }
        started_at: { $ref: '#/components/schemas/EpochMs' }
        ended_at: { $ref: '#/components/schemas/EpochMs' }
        start_lat_e7: { type: [integer, 'null'] }
        start_lon_e7: { type: [integer, 'null'] }
        end_lat_e7: { type: [integer, 'null'] }
        end_lon_e7: { type: [integer, 'null'] }
        distance_m: { type: integer, minimum: 0 }
        purpose: { type: string }
        edited_at: { type: [integer, 'null'] }
    TripCreate:
      type: object
      required: [kind, started_at, ended_at, distance_m, purpose]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/TripKind' }
        started_at: { $ref: '#/components/schemas/EpochMs' }
        ended_at: { $ref: '#/components/schemas/EpochMs' }
        distance_m: { type: integer, minimum: 1 }
        purpose: { type: string, minLength: 1, maxLength: 200 }
    TripEditResult:
      type: object
      required: [trip, shift]
      properties:
        trip: { oneOf: [{ $ref: '#/components/schemas/Trip' }, { type: 'null' }], description: Null only for a trip override whose trip_key matches no trip (reported as override_orphaned). }
        shift: { $ref: '#/components/schemas/Shift' }

    StopRole: { enum: [pickup, dropoff, other] }
    StopConfidence: { enum: [low, medium, high] }
    StopLabelPut:
      type: object
      required: [role, edited_at]
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/StopRole' }
        platform: { type: [string, 'null'], pattern: '^[a-z0-9_]{1,32}$' }
        place: { type: [string, 'null'], maxLength: 120 }
        payout_cents: { type: integer, minimum: 0, default: 0 }
        tip_cents: { type: integer, minimum: 0, default: 0 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        edited_at: { $ref: '#/components/schemas/EpochMs' }
    StopLabel:
      allOf:
        - { $ref: '#/components/schemas/StopLabelPut' }
        - type: object
          required: [stop_key, shift_id]
          properties:
            stop_key: { type: string }
            shift_id: { type: integer }
    Stop:
      type: object
      required: [stop_key, shift_id, started_at, ended_at, dwell_s, lat_e7, lon_e7, confidence, est_role, role, label]
      description: A derived stop (14 section 6). Never written by a client.
      properties:
        stop_key: { type: string }
        shift_id: { type: integer }
        started_at: { $ref: '#/components/schemas/EpochMs' }
        ended_at: { $ref: '#/components/schemas/EpochMs' }
        dwell_s: { type: integer, minimum: 0 }
        lat_e7: { type: integer }
        lon_e7: { type: integer }
        confidence: { $ref: '#/components/schemas/StopConfidence' }
        est_role: { enum: [pickup, dropoff, none], description: The engine's estimate; none = recorded but does not change the estimate. }
        role: { enum: [pickup, dropoff, other, none], description: The role used, the driver's label if any else est_role. }
        label: { oneOf: [{ $ref: '#/components/schemas/StopLabel' }, { type: 'null' }] }
    StopLabelResult:
      type: object
      required: [stop, shift]
      properties:
        stop:
          oneOf: [{ $ref: '#/components/schemas/Stop' }, { type: 'null' }]
          description: Null only when DELETE cleared a label whose stop no longer exists (label_orphaned).
        shift: { $ref: '#/components/schemas/Shift' }

    TelemetryPoint:
      type: object
      required: [seq, recorded_at, lat_e7, lon_e7, accuracy_m]
      additionalProperties: false
      properties:
        seq: { type: integer, minimum: 1 }
        recorded_at: { $ref: '#/components/schemas/EpochMs' }
        lat_e7: { type: integer, minimum: -900000000, maximum: 900000000 }
        lon_e7: { type: integer, minimum: -1800000000, maximum: 1800000000 }
        accuracy_m: { type: integer, minimum: 0 }
        speed_dmps: { type: [integer, 'null'], minimum: 0 }
        bearing_deg: { type: [integer, 'null'], minimum: 0, maximum: 359 }
        altitude_m: { type: [integer, 'null'] }
    TelemetryBatch:
      type: object
      required: [shift_client_id, points]
      additionalProperties: false
      properties:
        shift_client_id: { type: string, format: uuid }
        points: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/TelemetryPoint' } }
    TelemetryBatchResult:
      type: object
      required: [inserted, duplicates, rejected, server_time, upload_hint_s]
      properties:
        inserted: { type: integer, minimum: 0 }
        duplicates: { type: integer, minimum: 0 }
        rejected:
          type: array
          description: Permanently refused points. Everything not listed here is stored.
          items:
            type: object
            required: [seq, code]
            properties:
              seq: { type: integer }
              code: { enum: [invalid_coordinate, future_timestamp, outside_shift_window] }
        server_time: { $ref: '#/components/schemas/EpochMs' }
        upload_hint_s: { type: integer, minimum: 10, maximum: 300, description: Suggested seconds until the next upload (60). }

    Summary:
      type: object
      required: [from, to, shift_count, hours, earnings_cents, tips_cents, active_m, deadhead_m, personal_m, total_m, deduction_cents, hourly_earnings_cents]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        shift_count: { type: integer }
        hours: { type: number }
        earnings_cents: { type: [integer, 'null'], description: Effective earnings (18 section 4.3) - the driver's typed totals, else the stop labels' payout plus tips; null when nothing was entered or labelled, never 0. }
        tips_cents: { type: [integer, 'null'] }
        active_m: { type: integer }
        deadhead_m: { type: integer }
        personal_m: { type: integer }
        total_m: { type: integer }
        deduction_cents: { type: [integer, 'null'], description: null when the selected country has no registered pack. }
        hourly_earnings_cents: { type: [integer, 'null'], description: earnings_cents divided by hours; null when hours is 0. }
        platform_filter: { const: earnings_only, description: Present only when the platform query was given. }

    Backup:
      type: object
      required: [id, created_at, size_bytes, sha256, integrity_ok, trigger]
      properties:
        id: { type: integer }
        created_at: { $ref: '#/components/schemas/EpochMs' }
        size_bytes: { type: integer }
        sha256: { type: string }
        integrity_ok: { type: boolean }
        trigger: { enum: [nightly, shift_end, manual, pre_migration, pre_restore] }
    OffsiteState:
      type: object
      required: [last_download_at, synced_elsewhere_at, reminder_due]
      properties:
        last_download_at: { type: [integer, 'null'] }
        synced_elsewhere_at: { type: [integer, 'null'] }
        reminder_due: { type: boolean }
    RestoreVerification:
      type: object
      required: [integrity_ok, schema_version, shift_count, stop_label_count, point_count]
      properties:
        integrity_ok: { type: boolean }
        schema_version: { type: integer }
        shift_count: { type: integer }
        stop_label_count: { type: integer }
        point_count: { type: integer }
        first_shift_at: { type: [integer, 'null'] }
        last_shift_at: { type: [integer, 'null'] }
        latest_shift_total_m: { type: [integer, 'null'] }
    SystemStatus:
      type: object
      required: [app_version, schema_version, sqlite_version, db_bytes, wal_bytes, disk_free_bytes, disk_state, last_backup, offsite, paired_device_count, mode]
      properties:
        app_version: { type: string }
        schema_version: { type: integer }
        sqlite_version: { type: string }
        db_bytes: { type: integer }
        wal_bytes: { type: integer }
        disk_free_bytes: { type: integer }
        disk_state: { enum: [ok, warning, backup_skipped, writes_blocked] }
        last_backup: { oneOf: [{ $ref: '#/components/schemas/Backup' }, { type: 'null' }] }
        offsite: { $ref: '#/components/schemas/OffsiteState' }
        paired_device_count: { type: integer }
        mode: { enum: [normal, read_only, restoring] }
        diagnostics:
          type: object
          description: Present when the diagnostics module is on (16 section 7.2).
          properties:
            level: { enum: [off, basic, verbose] }
            db_bytes: { type: integer }
            event_count: { type: integer }
    DiagnosticsSettings:
      type: object
      required: [level, verbose_until, capture]
      properties:
        level: { enum: [off, basic, verbose] }
        verbose_until: { type: [integer, 'null'], description: Epoch ms; verbose reverts to basic then. }
        capture:
          oneOf:
            - { $ref: '#/components/schemas/CaptureAssignment' }
            - { type: 'null' }
          description: For a device, its own active capture session; always null for a web session.
    CaptureAssignment:
      type: object
      required: [id, profile, expires_at, max_shifts, shifts_done]
      properties:
        id: { type: integer }
        profile: { enum: [dense] }
        expires_at: { $ref: '#/components/schemas/EpochMs' }
        max_shifts: { type: integer }
        shifts_done: { type: integer }
    DiagEventIn:
      type: object
      required: [kind, at, level, src, v, data]
      additionalProperties: false
      properties:
        kind: { type: string, maxLength: 40, pattern: '^[a-z_]+\.[a-z_]+$' }
        at: { $ref: '#/components/schemas/EpochMs' }
        level: { enum: [basic, verbose] }
        src: { enum: [phone_native, phone_js, server, web] }
        seq: { type: integer, minimum: 1, description: Required for phone sources; strictly increasing per (device, src). }
        shift: { type: string, format: uuid, description: Shift client_id. }
        cap: { type: integer, description: Capture session id. }
        v: { type: string, maxLength: 40, pattern: '^[0-9A-Za-z._+-]{1,40}$' }
        data: { type: object, description: 'Typed fields defined per kind in the shared package registry (16 section 3.2). Unknown fields are rejected. Never a coordinate, address, payout, label or free text (16 section 4).' }
    DiagIngestRequest:
      type: object
      required: [events]
      additionalProperties: false
      properties:
        events: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/DiagEventIn' } }
    DiagIngestResult:
      type: object
      required: [accepted, duplicates, discarded, rejected]
      properties:
        accepted: { type: integer }
        duplicates: { type: integer }
        discarded: { type: integer, description: Verbose events accepted but not stored because disk is low. }
        rejected:
          type: array
          items:
            type: object
            required: [index, reason]
            properties:
              index: { type: integer }
              reason: { enum: [unknown_kind, schema, pattern, level, scope, seq_required] }
    DiagEvent:
      type: object
      required: [id, src, at, received_at, level, kind, data]
      properties:
        id: { type: integer }
        src: { enum: [phone_native, phone_js, server, web] }
        device_id: { type: [integer, 'null'] }
        seq: { type: [integer, 'null'] }
        at: { $ref: '#/components/schemas/EpochMs' }
        received_at: { $ref: '#/components/schemas/EpochMs' }
        level: { enum: [basic, verbose] }
        kind: { type: string }
        shift: { type: [string, 'null'] }
        cap: { type: [integer, 'null'] }
        v: { type: [string, 'null'] }
        data: { type: object }
    DiagEventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DiagEvent' } }
        next_cursor: { type: [string, 'null'] }
    HealthCheck:
      type: object
      required: [id, label, state]
      properties:
        id: { type: string, description: 'H1 to H7 (device checks) or S1 to S5 (server checks), 16 section 10.1.' }
        label: { type: string }
        weight: { type: integer, description: Points toward the 0 to 100 score; absent for server checks. }
        value: { type: [number, 'null'] }
        unit: { type: string }
        state: { enum: [green, amber, red, na] }
    DeviceHealth:
      type: object
      required: [device_id, name, shifts_considered, score, state, checks]
      properties:
        device_id: { type: integer }
        name: { type: string }
        shifts_considered: { type: integer }
        score: { type: integer, minimum: 0, maximum: 100 }
        state: { enum: [green, amber, red, na] }
        checks: { type: array, items: { $ref: '#/components/schemas/HealthCheck' } }
    ServerHealth:
      type: object
      required: [state, checks]
      properties:
        state: { enum: [green, amber, red, na] }
        checks: { type: array, items: { $ref: '#/components/schemas/HealthCheck' } }
    DiagnosticsHealth:
      type: object
      required: [generated_at, devices, server]
      properties:
        generated_at: { $ref: '#/components/schemas/EpochMs' }
        devices: { type: array, items: { $ref: '#/components/schemas/DeviceHealth' } }
        server: { $ref: '#/components/schemas/ServerHealth' }
    CaptureSessionCreate:
      type: object
      required: [device_id]
      additionalProperties: false
      properties:
        device_id: { type: integer }
        profile: { enum: [dense], default: dense }
        hours: { type: integer, minimum: 1, maximum: 168, default: 48 }
        max_shifts: { type: integer, minimum: 1, maximum: 5, default: 3 }
    CaptureSessionPatch:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state: { const: ended }
    CaptureSession:
      type: object
      required: [id, device_id, profile, created_at, expires_at, ended_at, max_shifts, shifts_done, fix_count, bytes, state]
      properties:
        id: { type: integer }
        device_id: { type: integer }
        profile: { enum: [dense] }
        created_at: { $ref: '#/components/schemas/EpochMs' }
        expires_at: { $ref: '#/components/schemas/EpochMs' }
        ended_at: { type: [integer, 'null'] }
        max_shifts: { type: integer }
        shifts_done: { type: integer }
        fix_count: { type: integer }
        bytes: { type: integer }
        state: { enum: [active, ended, expired] }
    CaptureFix:
      type: object
      required: [seq, recorded_at, lat_e7, lon_e7, accuracy_m]
      additionalProperties: false
      properties:
        seq: { type: integer, minimum: 1 }
        recorded_at: { $ref: '#/components/schemas/EpochMs' }
        lat_e7: { type: integer, minimum: -900000000, maximum: 900000000 }
        lon_e7: { type: integer, minimum: -1800000000, maximum: 1800000000 }
        accuracy_m: { type: integer, minimum: 0 }
        speed_dmps: { type: [integer, 'null'] }
        bearing_deg: { type: [integer, 'null'] }
        altitude_m: { type: [integer, 'null'] }
    CaptureFixBatch:
      type: object
      required: [shift, fixes]
      additionalProperties: false
      properties:
        shift: { type: string, format: uuid, description: Shift client_id the fixes belong to. }
        fixes: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/CaptureFix' } }
    CaptureFixResult:
      type: object
      required: [accepted, duplicates]
      properties:
        accepted: { type: integer }
        duplicates: { type: integer }
    CaptureAnnotationPut:
      type: object
      required: [at, kind]
      additionalProperties: false
      properties:
        at: { $ref: '#/components/schemas/EpochMs' }
        kind: { enum: [real_stop, false_stop, missed_stop, event, note] }
        shift: { type: string, format: uuid }
        stop_key: { type: string }
        text: { type: string, maxLength: 500, description: Free text; capture data is not diagnostics and may contain it (16 section 8.2). }
    CaptureAnnotation:
      type: object
      required: [client_id, at, kind]
      properties:
        client_id: { type: string, format: uuid }
        at: { $ref: '#/components/schemas/EpochMs' }
        kind: { enum: [real_stop, false_stop, missed_stop, event, note] }
        shift: { type: [string, 'null'] }
        stop_key: { type: [string, 'null'] }
        text: { type: [string, 'null'] }
