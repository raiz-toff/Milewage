plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.qrscanner'
version = '0.1.0'

android {
  namespace "expo.modules.qrscanner"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

// QR decoding with ZXing (Apache-2.0): no Google ML Kit, no Play services, no usage logging
// (plan 24 section 6, Q1). `com.google.zxing:core` is the open-source ZXing project.
dependencies {
  implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
  implementation 'com.google.zxing:core:3.5.4'
  testImplementation 'junit:junit:4.13.2'
}
