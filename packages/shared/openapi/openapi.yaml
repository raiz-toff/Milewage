        - { name: bucket, in: query, schema: { enum: [day, week, month], default: day }, description: trends only. }
        - { name: platform, in: query, schema: { type: string } }
      responses:
        '200':
          description: The group. The shape of data depends on the group (see 18 section 10.1).
          content:
            application/json:
              schema:
                type: object
                required: [from, to, group, data]
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  group: { enum: [trends, rhythm, sources, outlook, efficiency, order_economics, cards] }
                  platform_filter: { const: earnings_only }
                  data: { type: [object, array, 'null'] }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /vehicles/{id}/maintenance:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
