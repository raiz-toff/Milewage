  /schedule/expand:
    post:
      tags: [schedule]
      operationId: expandSchedule
      summary: Create entries from the active templates for from..to, skipping off days and entries that exist. Never run by a job.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              additionalProperties: false
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { type: object, properties: { created: { type: integer } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /schedule/off-days/{date}:
    parameters:
      - { name: date, in: path, required: true, schema: { type: string, format: date } }
    put:
      tags: [schedule]
      operationId: putOffDay
      summary: Mark a non-delivery day (idempotent). Body may be empty object or carry a note.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: [string, 'null'], maxLength: 200 }
      responses:
