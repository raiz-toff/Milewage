    post:
      tags: [maintenance]
      operationId: createMaintenance
      summary: Add a service entry. With the expenses module on and a cost, record_expense (default true) creates a maintenance expense for the vehicle and links it.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceLog' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /maintenance/{id}:
    parameters:
