      summary: One group of period figures. Unknown is null, never 0. The platform filter applies to earnings only.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
